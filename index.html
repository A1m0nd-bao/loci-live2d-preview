<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090c">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'">
  <title>Loci Live2D Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="eyebrow">LOCI MOTION</span><h1>Live2D Library<span class="brand-dot"></span></h1></a>
    <nav class="header-actions" aria-label="资源管理">
      <a href="https://a1m0nd-bao.github.io/loci-motion-preview/" target="_blank" rel="noreferrer" class="quiet-link"><i data-lucide="arrow-up-right"></i>Motion Library</a>
      <a id="sheetLink" href="https://mcn5p3adfjf6.feishu.cn/wiki/SpgdwxnAti5561kkv9QcvHpFnUg" target="_blank" rel="noreferrer" class="button"><i data-lucide="table-2"></i>飞书编排</a>
      <button id="importButton" class="button primary"><i data-lucide="folder-plus"></i>导入模型</button>
    </nav>
  </header>
  <nav class="collection-nav" aria-label="角色资料库">
    <a href="./" aria-current="page"><i data-lucide="person-standing"></i>Live2D</a>
    <a href="personas/"><i data-lucide="book-user"></i>角色档案</a>
    <a href="personas/backgrounds/common-scenes-v1/"><i data-lucide="panels-top-left"></i>场景背景</a>
  </nav>
  <section class="library-heading">
    <div><p class="eyebrow">CHARACTER COLLECTION</p><h2>角色，有自己的节奏。</h2></div>
    <div class="library-stats"><strong id="count">0</strong><span>个角色</span><span class="stat-divider"></span><span id="syncTime">等待首批模型</span></div>
  </section>
  <section id="recentSection" class="recent-section" hidden>
    <div class="section-heading"><h2>最近上传</h2><span id="recentCount"></span></div>
    <div id="recentRail" class="recent-rail"></div>
  </section>
  <main class="library-layout">
    <aside class="sidebar">
      <label class="field"><span>搜索</span><div class="search-field"><i data-lucide="search"></i><input id="search" type="search" placeholder="角色、分类或标签" autocomplete="off"></div></label>
      <label class="field"><span>分类</span><select id="category"><option value="">全部分类</option></select></label>
      <label class="field"><span>资源</span><select id="source"><option value="">全部资源</option><option value="remote">飞书同步</option><option value="local">本地导入</option></select></label>
      <label class="field"><span>排序</span><select id="sort"><option value="recent">最近更新</option><option value="name">名称 A–Z</option></select></label>
      <div class="sidebar-divider"></div>
      <label class="toggle"><input id="hoverPlay" type="checkbox" checked><span>悬停播放</span></label>
      <label class="field"><span>预览背景</span><div class="color-row"><input id="previewBg" type="color" value="#101014" aria-label="预览背景颜色"><output id="previewBgLabel">#101014</output></div></label>
      <button id="folderButton" class="import-area"><i data-lucide="folder-open"></i><span>选择模型目录</span></button>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="libraryStatus" role="status">清单加载中</span></div>
    </aside>
    <section class="collection">
      <div class="toolbar"><div class="segmented" role="group" aria-label="显示模式"><button class="active" data-view="grid" aria-pressed="true" title="网格" aria-label="网格"><i data-lucide="layout-grid"></i></button><button data-view="list" aria-pressed="false" title="列表" aria-label="列表"><i data-lucide="list"></i></button></div><span id="resultCount" class="muted"></span><div class="toolbar-right"><button id="refresh" class="icon-button" title="刷新清单" aria-label="刷新清单"><i data-lucide="refresh-cw"></i></button></div></div>
      <div id="gallery" class="gallery"></div>
      <section id="empty" class="empty" hidden><div class="empty-art"><i data-lucide="person-standing"></i></div><p class="eyebrow">LIVE2D COLLECTION</p><h2 id="emptyTitle">等待第一位角色</h2><p id="emptyCopy">模型准备好后，就在这里见面。</p><button id="emptyImport" class="button primary"><i data-lucide="folder-plus"></i>导入模型</button></section>
      <div id="pageError" class="error" role="alert" hidden></div>
    </section>
  </main>
  <footer class="page-footer"><span>LOCI / LIVE2D</span><span id="footerCount">Character Archive</span></footer>
  <input id="zipInput" type="file" accept=".zip,application/zip" multiple hidden>
  <input id="directoryInput" type="file" webkitdirectory multiple hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="detailDialog" aria-labelledby="detailTitle">
    <div class="detail-shell">
      <header class="detail-header"><div><p class="eyebrow">CHARACTER PREVIEW</p><h2 id="detailTitle"></h2><p id="detailCategory" class="muted"></p></div><div class="detail-header-actions"><a id="download" class="icon-button" title="下载模型包" aria-label="下载模型包" download><i data-lucide="download"></i></a><button id="detailClose" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div></header>
      <div class="detail-body">
        <div class="preview-column"><div id="stage" class="stage"><img id="sceneImage" class="scene-image" alt="" hidden><canvas id="detailCanvas" aria-label="Live2D 角色预览"></canvas><div id="stageMessage" class="stage-message" role="status">正在加载角色</div><div class="stage-info"><span id="stageResolution"></span><span id="stageState">LIVE2D</span></div></div>
          <div class="player-bar"><button id="pause" class="icon-button" title="暂停" aria-label="暂停" disabled><i data-lucide="pause"></i></button><button id="replay" class="icon-button" title="重新播放" aria-label="重新播放" disabled><i data-lucide="rotate-ccw"></i></button><span class="control-divider"></span><label class="compact-field"><span>速度</span><select id="speed" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label class="toggle compact"><input id="loop" type="checkbox" checked disabled><span>循环</span></label><div class="zoom-controls"><button id="fit" class="icon-button" title="适应画面" aria-label="适应画面" disabled><i data-lucide="maximize"></i></button><input id="zoom" aria-label="缩放" type="range" min="40" max="200" value="100" disabled><output id="zoomValue">100%</output></div></div>
          <div id="detailError" class="error" role="alert" hidden></div>
        </div>
        <aside class="detail-sidebar">
          <div class="panel-heading"><span>动作与表情</span><span>01</span></div>
          <label class="field"><span>动作分组</span><select id="group" disabled></select></label>
          <label class="field"><span>动作</span><select id="motion" disabled></select></label>
          <p id="playing" class="playing muted">暂无动作</p>
          <label class="field"><span>表情</span><select id="expression" disabled></select></label>
          <label class="toggle"><input id="interaction" type="checkbox" checked disabled><span>视线跟随</span></label>
          <label class="toggle"><input id="physics" type="checkbox" checked disabled><span>物理模拟</span></label>
          <div class="panel-heading"><span>画面</span><span>02</span></div>
          <label class="field"><span>场景背景</span><select id="detailScene" disabled><option value="">无场景</option></select></label>
          <label class="field"><span>背景</span><div class="color-row"><input id="detailBg" type="color" value="#101014"><output id="detailBgLabel">#101014</output><button id="checker" class="icon-button" title="透明棋盘" aria-label="透明棋盘" aria-pressed="false"><i data-lucide="grid-2x2"></i></button></div></label>
          <dl id="details" class="model-details"></dl>
          <div id="characterLinks" class="character-links" hidden>
            <a id="personaLink" class="quiet-link"><i data-lucide="book-user"></i>角色档案</a>
          </div>
          <details id="layerPanel" class="layer-panel"><summary>图层检查<span>03</span></summary><p id="layerStatus" class="muted"></p><div class="layer-toolbar"><button id="layerReset" class="icon-button" title="恢复模型排序" aria-label="恢复模型排序" disabled><i data-lucide="undo-2"></i></button><button id="layerExport" class="icon-button" title="导出排序" aria-label="导出排序" disabled><i data-lucide="download"></i></button><button id="layerImportButton" class="icon-button" title="导入排序" aria-label="导入排序" disabled><i data-lucide="upload"></i></button></div><input id="layerImport" type="file" accept=".json" hidden><p id="layerError" class="error" role="alert"></p><ol id="layers" aria-label="图层从前到后"></ol></details>
        </aside>
      </div>
    </div>
  </dialog>
  <canvas id="hoverCanvas" class="hover-canvas" hidden></canvas>
  <script src="vendor/fflate.js"></script>
  <script src="vendor/lucide.js"></script>
  <script src="vendor/live2dcubismcore.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/cubism4.js"></script>
  <script src="layers.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
