name: Publish Live2D Pages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Asset release tag
        required: true
        type: string
      action_overlay_tag:
        description: Optional reviewed action-package overlay release (preserves base assets)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: live2d-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract library
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACTION_OVERLAY_TAG: ${{ inputs.action_overlay_tag }}
        run: |
          # Explicit rejection takes precedence over an old manually supplied tag.
          if [ -f action-overlay.json ] && ! python3 -c 'import json,sys; sys.exit(0 if json.load(open("action-overlay.json")).get("enabled",False) else 1)'; then
            ACTION_OVERLAY_TAG=""
          elif [ -z "$ACTION_OVERLAY_TAG" ] && [ -f action-overlay.json ]; then
            ACTION_OVERLAY_TAG="$(python3 -c 'import json,os; d=json.load(open("action-overlay.json")); print(d["releaseTag"] if d.get("enabled",False) and d["baseRelease"] == os.environ["RELEASE_TAG"] else "")')"
          fi
          for attempt in 1 2 3; do
            if gh release download "$RELEASE_TAG" --pattern 'live2d-site.zip.part-*' --dir "$RUNNER_TEMP" --clobber; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          cat "$RUNNER_TEMP"/live2d-site.zip.part-* > "$RUNNER_TEMP/live2d-site.zip"
          mkdir -p _site
          unzip -q "$RUNNER_TEMP/live2d-site.zip" -d _site
          if [ -n "$ACTION_OVERLAY_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/action-overlay"
            gh release download "$ACTION_OVERLAY_TAG" --pattern 'safe-actions.zip.part-*' --dir "$RUNNER_TEMP/action-overlay"
            cat "$RUNNER_TEMP"/action-overlay/safe-actions.zip.part-* > "$RUNNER_TEMP/safe-actions.zip"
            unzip -oq "$RUNNER_TEMP/safe-actions.zip" -d _site
          fi
          for archive in _site/packages/*.zip; do
            package_id="$(basename "$archive" .zip)"
            mkdir -p "_site/models/$package_id"
            unzip -q "$archive" -d "_site/models/$package_id"
          done
          if [ -f wave-trial.json ]; then
            WAVE_TRIAL_TAG="$(python3 -c 'import json,os; d=json.load(open("wave-trial.json")); print(d["releaseTag"] if d.get("enabled",False) and d["baseRelease"] == os.environ["RELEASE_TAG"] else "")')"
            if [ -n "$WAVE_TRIAL_TAG" ]; then
              mkdir -p "$RUNNER_TEMP/wave-trial"
              gh release download "$WAVE_TRIAL_TAG" --pattern 'wave-trial.zip.part-*' --dir "$RUNNER_TEMP/wave-trial"
              cat "$RUNNER_TEMP"/wave-trial/wave-trial.zip.part-* > "$RUNNER_TEMP/wave-trial.zip"
              python3 -c 'import hashlib,json,sys; d=json.load(open("wave-trial.json")); assert hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest() == d["sha256"]' "$RUNNER_TEMP/wave-trial.zip"
              unzip -q "$RUNNER_TEMP/wave-trial.zip" -d _site
            fi
          fi
      - name: Overlay current preview application
        run: |
          # Keep release models, posters and character archives; ship current app code.
          for file in index.html styles.css app.js player.js breathing.js legacy-selector.js atmosphere.js model-files.js layers.js render.html render.js; do
            cp "$file" "_site/$file"
          done
          cp -R assets/. _site/assets/
      - name: Verify complete library and scoped action overlay
        run: python3 scripts/verify-pages-library.py _site
      - name: Verify restored original-100 package hashes
        run: python3 scripts/verify-restored-library.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
