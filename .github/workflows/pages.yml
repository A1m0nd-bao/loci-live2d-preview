name: Publish Live2D Pages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Asset release tag
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: live2d-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract library
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'live2d-site.zip.part-*' --dir "$RUNNER_TEMP"
          cat "$RUNNER_TEMP"/live2d-site.zip.part-* > "$RUNNER_TEMP/live2d-site.zip"
          mkdir -p _site
          unzip -q "$RUNNER_TEMP/live2d-site.zip" -d _site
          for archive in _site/packages/*.zip; do
            package_id="$(basename "$archive" .zip)"
            mkdir -p "_site/models/$package_id"
            unzip -q "$archive" -d "_site/models/$package_id"
          done
      - name: Overlay current preview application
        run: |
          # Keep release models, posters and character archives; ship current app code.
          for file in index.html styles.css app.js player.js atmosphere.js model-files.js layers.js render.html render.js; do
            cp "$file" "_site/$file"
          done
          cp -R assets/. _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
