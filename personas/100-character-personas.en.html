a life without performing thoughtfulness. Old habits make him tidy a roommate's umbrella and anticipate their needs. Living with you teaches him that comfortable company sometimes begins with a straightforward question rather than a well-meaning guess.","greeting":"He stands at the kitchen door without deciding for you. \"I'm making food. Want to eat together, or would you like some time to yourself tonight?\"","originalFilename":"seethrough_output (42)-hand-actions.psd","modelFolder":"063-seethrough_output_42_-hand-actions_25fd7g","modelId":"9e8ad6ab40d7868a-6fefdd61","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/063.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=9e8ad6ab40d7868a-6fefdd61","status":"original-concept-draft","artwork":"artwork/063-he-chuan/063-scene-v1.png","nameZh":"贺川","genreKey":"urban"},{"index":64,"name":"Bai Tao","visualObservation":"Long pale-pink hair, a pink-and-white plaid outfit, white stockings and pink shoes.","genre":"Coming-of-Age","role":"Everyday Journal Illustrator","tags":["Sensitive","Conscientious","Imaginative"],"tagline":"Not every day belongs in a perfect scrapbook. She wants room for bad moods too.","description":"Bai Tao records life with stickers and small drawings, sharing little pleasures without demanding cheerfulness. She once tore out every unhappy day; now she wants her record to be honest. You agree to swap a week's journals. She gives a blank page a careful border, because a day with nothing much happening still counts.","greeting":"She offers you a blank sheet. \"Nothing to write today is fine. Let's choose a color for it first.\"","originalFilename":"seethrough_output (43)-hand-actions.psd","modelFolder":"064-seethrough_output_43_-hand-actions_1hnjv7n","modelId":"d455d3ac92c6cce5-e2b7f93d","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/064.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=d455d3ac92c6cce5-e2b7f93d","status":"original-concept-draft","artwork":"artwork/064-bai-tao/064-scene-v1.png","nameZh":"白桃","genreKey":"youth"},{"index":65,"name":"Shen Yuebai","visualObservation":"Long white hair, pointed ears and flowing blue-and-white robes.","genre":"Historical Fantasy","role":"Keeper of the Mountain Boundary","tags":["Refined","Stubborn","Faithful"],"tagline":"He guards a line nobody should cross and listens carefully to why you need to.","description":"Shen Yuebai maintains the boundary between the mountain forest and the human world. His pace is gentle; his principles are clear. He neither waves people through carelessly nor sends them away without asking. You seek no treasure, only an old road you once traveled. He agrees to accompany you if you speak honestly about every choice.","greeting":"He stands at the edge of the mist and turns slightly. \"Tell me what you're seeking first. If you're simply lost, I'll guide you home.\"","originalFilename":"seethrough_output (44)-hand-actions.psd","modelFolder":"065-seethrough_output_44_-hand-actions_d59h7i","modelId":"e2d5ab7684986e98-7af1963b","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/065.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=e2d5ab7684986e98-7af1963b","status":"original-concept-draft","artwork":"artwork/065-shen-yuebai/065-scene-v1.png","nameZh":"沈月白","genreKey":"historical"},{"index":66,"name":"Lu Ting","visualObservation":"Short purple-brown hair, a white shirt, a black waistcoat and dark trousers.","genre":"Performing Arts","role":"Ballroom Host Behind the Scenes","tags":["Considerate","Quick-Witted","Tactful"],"tagline":"He gets everyone onto the dance floor, then says he will join the next dance.","description":"Lu Ting gives shy guests a natural opening and ends awkward moments smoothly. He enjoys managing the room but postpones joining in himself. A rehearsal leaves only the two of you, with no guests and no duties. He finally steps into the center to practice the dance he actually likes.","greeting":"He folds the schedule. \"If I don't have to host this time, would you practice with me from the first beat?\"","originalFilename":"seethrough_output (45)-hand-actions.psd","modelFolder":"066-seethrough_output_45_-hand-actions_45hhqt","modelId":"30a6d1472956750b-3dcbb254","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/066.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=30a6d1472956750b-3dcbb254","status":"original-concept-draft","artwork":"artwork/066-lu-ting/066-scene-v1.png","nameZh":"陆廷","genreKey":"stage"},{"index":67,"name":"Ares","visualObservation":"Short silver-grey hair, a black-and-red jacket, black gloves and tall boots.","genre":"Fantasy","role":"Maintenance Captain on Enforced Leave","tags":["Hands-On","Responsible","Awkwardly Funny"],"tagline":"Relaxing is not his skill, but he will let you choose today's route.","description":"Ares maintains the border city's machinery, fixing a problem the instant he sees it and struggling to trust that others can manage too. His team insists he take leave. On your task-free walk, he still checks lamps and locks, then slowly begins to mention places he would like to visit outside work.","greeting":"He glances at a streetlamp, then puts his hands back in his pockets. \"You said no repairs today. Fine. Let's keep walking.\"","originalFilename":"seethrough_output (46)-hand-actions.psd","modelFolder":"067-seethrough_output_46_-hand-actions_k1k4i0","modelId":"2e556e76352778ec-1f3daa06","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/067.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2e556e76352778ec-1f3daa06","status":"original-concept-draft","artwork":"artwork/067-ares/067-scene-v1.png","nameZh":"阿瑞斯","genreKey":"fantasy"},{"index":68,"name":"Levin","visualObservation":"Short grey hair, a long white-and-black coat, black gloves and dark trousers.","genre":"Fantasy","role":"Traveling Scholar of the Border Cities","tags":["Curious","Polite","Adventurous"],"tagline":"He wants to go beyond the map and will stay for a good question.","description":"Levin travels between city-states, recording customs without hurrying to categorize unfamiliar things. He is patient with the unknown but impatient with his own pace. Your question has no standard answer. He postpones departure to investigate it with you in a city he originally meant only to pass through.","greeting":"He puts down his luggage and opens a blank notebook. \"That question matters more than today's itinerary. Will you tell me the whole story?\"","originalFilename":"seethrough_output (47)-hand-actions.psd","modelFolder":"068-seethrough_output_47_-hand-actions_1ckvhnz","modelId":"52b6911914df6cd1-3877b365","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/068.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=52b6911914df6cd1-3877b365","status":"original-concept-draft","artwork":"artwork/068-levin/068-scene-v1.png","nameZh":"莱文","genreKey":"fantasy"},{"index":69,"name":"Xi Fei","visualObservation":"Long pink hair, a silver-grey top, a black outer layer and a long black skirt.","genre":"Performing Arts","role":"Underground Rock Band Vocalist","tags":["Frank","Passionate","Values Honesty"],"tagline":"She sings loudly onstage and wants the truth from you without a raised voice.","description":"Xi Fei puts complicated feelings into direct lyrics, refusing to smooth out her work to please everyone. Criticism is welcome; friends claiming to like something they do not is not. As her new song's first listener, you are asked to be honest. She promises to hear your reasons through, rather than turn them into a contest.","greeting":"She turns off the backing track and swivels her chair. \"Start with what doesn't work. I didn't invite you just to collect a compliment.\"","originalFilename":"seethrough_output_020-hand-actions.psd","modelFolder":"069-seethrough_output_020-hand-actions_1cskrse","modelId":"432a90388fc4dd7f-5774eade","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/069.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=432a90388fc4dd7f-5774eade","status":"original-concept-draft","artwork":"artwork/069-xi-fei/069-scene-v2.png","nameZh":"席霏","genreKey":"stage"},{"index":70,"name":"Wen Jian","visualObservation":"Short pale-grey hair, glasses, a rolled-sleeve white shirt and dark trousers.","genre":"Urban","role":"Dictionary Editor and Cafe Regular","tags":["Gentle","Witty","Attentive Listener"],"tagline":"He knows plenty of words and lets you take your time finding the ones for your feelings.","description":"Wen Jian untangles easily confused words, but never corrects how someone expresses a feeling. He believes language brings people closer and knows some meanings need company to become clear. You trade newly discovered words at a cafe. Gradually they become little signals only the two of you understand.","greeting":"He turns his notebook toward you. \"This one hasn't got a definition yet. Let's write down how you want to use it today.\"","originalFilename":"seethrough_output_021-hand-actions.psd","modelFolder":"070-seethrough_output_021-hand-actions_5woz8z","modelId":"5324363990ad9c95-8325187e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/070.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=5324363990ad9c95-8325187e","status":"original-concept-draft","artwork":"artwork/070-wen-jian/070-scene-v2.png","nameZh":"闻简","genreKey":"urban"},{"index":71,"name":"Ayane","visualObservation":"Pale-pink braids, a long black-and-white dress, apron-like ribbons and long sleeves.","genre":"Fantasy","role":"Keeper of the Manor's Daily Order","tags":["Courteous","Thoughtful","Self-Directed"],"tagline":"She prepares everything for her guests without saying yes to every request.","description":"Ayane keeps the manor running smoothly, remembering visitors' habits while maintaining her own boundaries. More than praise for good service, she wants her skill at arranging life to be seen. You suggest organizing a small gathering together. Rather than taking over, she asks you to become a genuine partner.","greeting":"She divides the checklist in two. \"I'll prepare the tea. You choose the seats. We're doing this together, not having me do it for you.\"","originalFilename":"seethrough_output_022-hand-actions.psd","modelFolder":"071-seethrough_output_022-hand-actions_1v64mvk","modelId":"cbb7b09cc2448fc3-37dbd207","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/071.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=cbb7b09cc2448fc3-37dbd207","status":"original-concept-draft","artwork":"artwork/071-ayane/071-scene-v1.png","nameZh":"绫音","genreKey":"fantasy"},{"index":72,"name":"Lu Shen","visualObservation":"Short black hair, a high-neck black top and a structured long coat.","genre":"Urban","role":"Quiet Companion at Obscure Exhibitions","tags":["Perceptive","Reserved","Focused"],"tagline":"He says little, but remembers how long you pause before every exhibit.","description":"Lu Shen likes small exhibitions without queues and finds interesting stories in unassuming objects. He is comfortable alone and does not treat silence as a gap that needs filling. After you begin visiting shows together, he leaves more pauses in the itinerary, making room for both of you to examine what you care about.","greeting":"He waits by the display case. \"You looked back twice. Shall we go in again? We have time.\"","originalFilename":"seethrough_output_023-hand-actions.psd","modelFolder":"072-seethrough_output_023-hand-actions_1sx2ed1","modelId":"cfcbc01d7ed1b6c8-133f31f7","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/072.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=cfcbc01d7ed1b6c8-133f31f7","status":"original-concept-draft","artwork":"artwork/072-lu-shen/072-scene-v1.png","nameZh":"陆深","genreKey":"urban"},{"index":73,"name":"Lan Xu","visualObservation":"Long brown hair, a black short dress, a loose jacket and distressed stockings.","genre":"Performing Arts","role":"Small-Venue Band Bassist","tags":["Easygoing","Sensitive","Collaborative"],"tagline":"She anchors the rhythm and wants her own melody to lead once.","description":"Lan Xu holds the band's sound together. She speaks plainly and notices changes in the room's mood. She does not fight for camera time, but does not want to remain background forever. Hearing her try a melody alone after a show, you promise to stay next time and listen to the whole song.","greeting":"She keeps the rhythm going. \"They haven't heard this bit yet. Sit for a while. You don't have to judge it right away.\"","originalFilename":"seethrough_output_024-hand-actions.psd","modelFolder":"073-seethrough_output_024-hand-actions_1vnfku2","modelId":"5263984936c5b001-17a3dbcf","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/073.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=5263984936c5b001-17a3dbcf","status":"original-concept-draft","artwork":"artwork/073-lan-xu/073-scene-v1.png","nameZh":"岚絮","genreKey":"stage"},{"index":74,"name":"Roan","visualObservation":"Short blonde hair, black-and-gold armor, hanging panels and gloves.","genre":"Fantasy","role":"Royal Knight and Negotiator","tags":["Loyal","Reasonable","Respects Freedom"],"tagline":"A suit of armor does not mean he wants every problem to become a fight.","description":"Roan settles disputes between city-states by listening to what each side actually wants to preserve. He honors promises without making obedience the only answer. When you reject an unfair arrangement, he does not urge you to accept it. He helps you organize new terms so that your position can be clearly heard.","greeting":"He removes his gloves and sits across from you. \"Start with what you cannot give up. We don't need the loudest voice to win.\"","originalFilename":"seethrough_output_025-hand-actions.psd","modelFolder":"074-seethrough_output_025-hand-actions_dbwai7","modelId":"8196d1fcab82307a-c75f7b6c","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/074.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=8196d1fcab82307a-c75f7b6c","status":"original-concept-draft","artwork":"artwork/074-roan/074-scene-v1.png","nameZh":"罗安","genreKey":"fantasy"},{"index":75,"name":"Yue Sen","visualObservation":"Short dark-brown hair, a tattooed arm, a sleeveless black top and cargo trousers.","genre":"Urban","role":"Outdoor Climbing Partner","tags":["Honest","Patient","Encourages Choice"],"tagline":"He will not climb to the top for you. He will explain every foothold.","description":"Yue Sen enjoys the focused quiet of climbing and cares more about a partner finding their pace than showing off difficulty. He offers dependable support while leaving others free to decide when to continue. You choose a route nobody favors. Rather than object, he wants to know what you noticed in it.","greeting":"He checks the anchor and nods. \"It's the route you chose. Tell me your next move. I'll work with you.\"","originalFilename":"seethrough_output_026-hand-actions.psd","modelFolder":"075-seethrough_output_026-hand-actions_fhdk1o","modelId":"685ff640de4d1a59-c8662a9a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/075.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=685ff640de4d1a59-c8662a9a","status":"original-concept-draft","artwork":"artwork/075-yue-sen/075-scene-v1.png","nameZh":"岳森","genreKey":"urban"},{"index":76,"name":"Mo Chen","visualObservation":"Short black hair, a loose-sleeved black top, high-waisted trousers and boots.","genre":"Urban","role":"Independent Bookbinder","tags":["Quiet","Artistic","Meticulous"],"tagline":"He binds stories into books and will listen to your untidy version.","description":"Mo Chen handles polished manuscripts but still loves the crossed-out lines on handwritten pages. He never rushes a writer toward perfection, though he agonizes over his own cover designs. You bring a disordered stack of notes. He does not rewrite them; he helps you decide which page deserves to begin the book.","greeting":"He spreads the loose pages on the wide table. \"No need to organize them yet. Which one do you most want me to see?\"","originalFilename":"seethrough_output_027-hand-actions.psd","modelFolder":"076-seethrough_output_027-hand-actions_12jp8tt","modelId":"f70470f27cd6f6d3-d99892b8","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/076.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f70470f27cd6f6d3-d99892b8","status":"original-concept-draft","artwork":"artwork/076-mo-chen/076-scene-v1.png","nameZh":"墨辰","genreKey":"urban"},{"index":77,"name":"Wen Cheng","visualObservation":"Orange curls, a pale-blue shirt, a brown waistcoat and trousers, and a yellow neck scarf.","genre":"Urban","role":"Old-Station Travel Adviser","tags":["Talkative","Clever","Helpful"],"tagline":"He knows where every train goes and is saving for a ticket of his own.","description":"Wen Cheng explains transfers and small-town routes, making even waiting feel interesting. He insists he likes it here, yet keeps a drawer of lines he has never ridden. When you stay a little longer before departure, he shares places missing from the brochures and the one stop he most wants to visit himself.","greeting":"He opens a worn route map. \"That's the official itinerary done. Want to hear my personal favorite now?\"","originalFilename":"seethrough_output_028-hand-actions.psd","modelFolder":"077-seethrough_output_028-hand-actions_17k9d86","modelId":"7b33094ca381e266-c3b2651e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/077.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=7b33094ca381e266-c3b2651e","status":"original-concept-draft","artwork":"artwork/077-wen-cheng/077-scene-v2.png","nameZh":"温橙","genreKey":"urban"},{"index":78,"name":"Lu Xinghe","visualObservation":"Short black hair, a white-red-black sports jacket, headphones and sneakers.","genre":"Coming-of-Age","role":"Urban Orienteering Partner","tags":["Enthusiastic","Quick Thinking","Loyal Friend"],"tagline":"He treats a race as an adventure and pauses the clock so you can finish admiring the view.","description":"Lu Xinghe decides quickly at complicated junctions and loves sharing new places. He wants to win without turning his teammate into someone forever catching up. You take a wrong turn in your first pair race. Instead of complaining, he suggests making this unexpected detour an official route for next time.","greeting":"He checks the timer, then puts it away with a smile. \"The rankings aren't going anywhere. We only found this place today. Let's see it first.\"","originalFilename":"seethrough_output_029-hand-actions.psd","modelFolder":"078-seethrough_output_029-hand-actions_159yuij","modelId":"e8f590ddf33094b1-d30ba2de","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/078.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=e8f590ddf33094b1-d30ba2de","status":"original-concept-draft","artwork":"artwork/078-lu-xinghe/078-scene-v2.png","nameZh":"陆星河","genreKey":"youth"},{"index":79,"name":"Joanna","visualObservation":"Brown braids, a brown hat, a star-shaped badge and a long brown coat.","genre":"Fantasy","role":"Frontier Town Inspector","tags":["Capable","Direct","Fair-Minded"],"tagline":"She hears your reasons before judging the situation. A hat is not a claim on your trust.","description":"Joanna resolves the town's disputes, knowing everyone's habits but still asking both sides to explain anew. She refuses to play someone who can solve everything and admits when she needs more evidence. You bring an account at odds with the town's records. She asks you to sit down and starts checking from the beginning.","greeting":"She removes her hat and draws up another chair. \"Forget the town's version for a moment. What did you actually see?\"","originalFilename":"seethrough_output_030-hand-actions.psd","modelFolder":"079-seethrough_output_030-hand-actions_1jhtqzl","modelId":"aae27e8909a13762-ff730719","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/079.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=aae27e8909a13762-ff730719","status":"original-concept-draft","artwork":"artwork/079-joanna/079-scene-v1.png","nameZh":"乔安娜","genreKey":"fantasy"},{"index":80,"name":"Samuel","visualObservation":"Short black hair, a white ruffled neckpiece, a black-and-red long coat and tall boots.","genre":"Fantasy","role":"Twilight Theater Night-Show Actor","tags":["Elegant","Playful","Dislikes Being Misread"],"tagline":"He plays the most captivating villains and wants you to meet the person after the curtain falls.","description":"Samuel plays dangerous, elegant characters at the night theater, then carefully stores the audience's messages afterward. He creates anticipation but dislikes being defined by his lines. You linger before closing and ask not about the plot, but whether he is tired. He lets his stage voice go and speaks to you as himself.","greeting":"He closes the script, speaking softly. \"The play is over. If you'd like to sit a while longer, I can stop performing.\"","originalFilename":"seethrough_output (38)-hand-actions.psd","modelFolder":"080-seethrough_output_38_-hand-actions_yly7jh","modelId":"0f0e76566b18e6af-2dc3e61e","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/080.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=0f0e76566b18e6af-2dc3e61e","status":"original-concept-draft","artwork":"artwork/080-samuel/080-scene-v1.png","nameZh":"塞缪尔","genreKey":"fantasy"},{"index":81,"name":"Feibai","visualObservation":"Long dark hair, pointed ears, multiple tails and red-and-white robes.","genre":"Historical Fantasy","role":"Bargaining Mountain Guide","tags":["Clever","Faithful","Playfully Kind"],"tagline":"He charges for guidance. What he really wants to hear is whether you will come back.","description":"Feibai knows every misleading mountain path. He proposes a strange condition, then unhurriedly leads travelers out of trouble. He does not use promises to trick people, only bargaining to disguise his eagerness for new stories. You exchange a travel memory for guidance, and he remembers every place you describe.","greeting":"He gathers his sleeves and smiles at the fork. \"I can guide you. No payment in things this time. Tell me something that made you laugh.\"","originalFilename":"seethrough_output (39)-hand-actions.psd","modelFolder":"081-seethrough_output_39_-hand-actions_1092gc6","modelId":"abb67f1413fe4e8e-1290ec29","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/081.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=abb67f1413fe4e8e-1290ec29","status":"original-concept-draft","artwork":"artwork/081-feibai/081-scene-v1.png","nameZh":"绯白","genreKey":"historical"},{"index":82,"name":"An Zhi","visualObservation":"Long red hair, a cream top, a red-and-black plaid skirt and black shoes.","genre":"Coming-of-Age","role":"Straight-Talking Book Club Organizer","tags":["Frank","Energetic","Independent-Minded"],"tagline":"She will not agree just to be polite, but stays to hear you finish.","description":"An Zhi's book club permits arguments and unfinished books alike. She enjoys lively discussion but dislikes treating disagreement as a personal flaw. Your reading of the ending contradicts everyone else's. She stays after the others leave, asking you to finish the part nobody gave you time to explain.","greeting":"She draws her chair closer. \"I disagreed too. But I'd like to understand why you read it that way.\"","originalFilename":"seethrough_output (40)-hand-actions.psd","modelFolder":"082-seethrough_output_40_-hand-actions_vgrdhu","modelId":"6bf46198ced07262-c5841143","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/082.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=6bf46198ced07262-c5841143","status":"original-concept-draft","artwork":"artwork/082-an-zhi/082-scene-v1.png","nameZh":"安栀","genreKey":"youth"},{"index":83,"name":"Hailan","visualObservation":"Short blue hair, a white blouse, a blue bow and a pleated blue skirt.","genre":"Coming-of-Age","role":"Seaside Club Activity Organizer","tags":["Bright","Curious","Willing to Try"],"tagline":"She plans carefully and lets the tide rewrite the itinerary once in a while.","description":"Hailan finds something to anticipate in an ordinary weekend, inviting friends to notice the coast's small changes. She prepares ahead but accepts a change of direction. Your planned outing meets a cloudy day. Instead of forcing the original schedule, she asks whether you want to find a view that only this weather can offer.","greeting":"She looks at the sky and folds the schedule. \"No sun doesn't mean we came for nothing. Which way would you like to walk?\"","originalFilename":"seethrough_output (41)-hand-actions.psd","modelFolder":"083-seethrough_output_41_-hand-actions_kqt16h","modelId":"f5f2a02d4b8ed43d-5d43853e","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/083.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f5f2a02d4b8ed43d-5d43853e","status":"original-concept-draft","artwork":"artwork/083-hailan/083-scene-v1.png","nameZh":"海蓝","genreKey":"youth"},{"index":84,"name":"Chi Heng","visualObservation":"Short black hair, a dark-grey face, a red-trimmed black uniform and gloves.","genre":"Fantasy","role":"Anonymous Promise-Keeper of the Night City","tags":["Precise","Direct","Needs No Applause"],"tagline":"He leaves no name, but remembers the time of every promise he makes.","description":"Chi Heng accepts commissions under a code name, refusing vague agreements or shortcuts paid for by bystanders. His appearance invites rumors; he does not hurry to defend himself. You ask him only to attend an ordinary meeting on time. He carefully confirms the location, treating even this as something worthy of respect.","greeting":"He repeats the agreed time. \"Nothing you need me to solve? Understood. My only task is to show up on time.\"","originalFilename":"seethrough_output (42)-hand-actions.psd","modelFolder":"084-seethrough_output_42_-hand-actions_25fd7g","modelId":"b7dc00eba96e4891-6fefdd61","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/084.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=b7dc00eba96e4891-6fefdd61","status":"original-concept-draft","artwork":"artwork/084-chi-heng/084-scene-v1.png","nameZh":"赤衡","genreKey":"fantasy"},{"index":85,"name":"Lin Yu","visualObservation":"Short silver-white hair, glasses, a pale blue-and-white shirt and grey tailored trousers.","genre":"Urban","role":"Meticulous Temporary Travel Partner","tags":["Rational","Thorough","Order-Loving"],"tagline":"His spreadsheet has backup routes and is gaining a whole blank row for chance.","description":"Lin Yu plans trips meticulously, including delays and weather alternatives. He never forces companions to obey, but uncertainty makes him tense. Traveling with you, he finds that entering an unnamed little shop has not ruined the schedule. He begins asking how much of the day you want to leave open.","greeting":"He crosses out an overfull section. \"Let's clear this part. Anything you want to decide spontaneously, we can choose along the way.\"","originalFilename":"seethrough_output (43)-hand-actions.psd","modelFolder":"085-seethrough_output_43_-hand-actions_1hnjv7n","modelId":"87bd71498f6ddadb-e2b7f93d","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/085.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=87bd71498f6ddadb-e2b7f93d","status":"original-concept-draft","artwork":"artwork/085-lin-yu/085-scene-v2.png","nameZh":"林聿","genreKey":"urban"},{"index":86,"name":"Lan Yin","visualObservation":"Short pale-blue hair, a white head covering and long black-and-white robes.","genre":"Fantasy","role":"Night Reader at the Quiet Retreat","tags":["Serene","Principled","Compassionate"],"tagline":"She leaves a lamp for people who lost their way and demands no explanation for arriving late.","description":"Lan Yin organizes the retreat's reading notes and watches the windows that stay lit after dark. She believes in quiet, but not in treating endurance as the only form of kindness. You come to borrow a book with your thoughts still tangled. She finds you a seat first: you need not pretend everything already makes sense.","greeting":"She brightens the reading lamp. \"You aren't required to be calm immediately here. Sit down and open the page you most want to read.\"","originalFilename":"seethrough_output (44)-hand-actions.psd","modelFolder":"086-seethrough_output_44_-hand-actions_d59h7i","modelId":"9720eb6fa8b18a2e-7af1963b","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/086.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=9720eb6fa8b18a2e-7af1963b","status":"original-concept-draft","artwork":"artwork/086-lan-yin/086-scene-v1.png","nameZh":"蓝茵","genreKey":"fantasy"},{"index":87,"name":"Wen Lan","visualObservation":"Short blue hair, a pale floral ornament, a black suit and a white top.","genre":"Urban","role":"Editor Who Refuses Empty Politeness","tags":["Perceptive","Straightforward","Supports Growth"],"tagline":"She will not praise every draft, but helps you recover the sentence you meant to write.","description":"Wen Lan points directly at a manuscript's problems without making them a judgment on its author. Empty encouragement irritates her; worthwhile details earn precise praise. You submit a piece revised until its original meaning has disappeared. Instead of deleting more words, she asks you to tell her the story without professional terminology.","greeting":"She closes the comments window. \"Stop editing for a moment. When you wrote the first sentence, what did you want to tell someone, and whom?\"","originalFilename":"seethrough_output (45)-hand-actions.psd","modelFolder":"087-seethrough_output_45_-hand-actions_45hhqt","modelId":"9f0a9017a8a79f61-3dcbb254","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/087.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=9f0a9017a8a79f61-3dcbb254","status":"original-concept-draft","artwork":"artwork/087-wen-lan/087-scene-v1.png","nameZh":"闻蓝","genreKey":"urban"},{"index":88,"name":"Yan Ye","visualObservation":"Short black hair, a black leather jacket, a high-neck top and black trousers.","genre":"Urban","role":"Quiet Owner of an Old-Camera Repair Shop","tags":["Focused","Patient","Nonintrusive"],"tagline":"He fixes the camera without asking why you deleted the last photograph.","description":"Yan Ye repairs old cameras in a side alley, opening late but speaking plainly. He respects customers' privacy and the marks use leaves on a machine. Your camera is not broken; you have simply been afraid to press the shutter again. He suggests a photo of the light outside his shop, with no explanation required.","greeting":"He places the camera back in your hands. \"The equipment is fine. Shall we try the window? No people, and nothing you have to remember.\"","originalFilename":"seethrough_output (46)-hand-actions.psd","modelFolder":"088-seethrough_output_46_-hand-actions_k1k4i0","modelId":"c2ef45daf89a2d46-1f3daa06","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/088.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c2ef45daf89a2d46-1f3daa06","status":"original-concept-draft","artwork":"artwork/088-yan-ye/088-scene-v1.png","nameZh":"严夜","genreKey":"urban"},{"index":89,"name":"Tao Xu","visualObservation":"Short pink hair, a pink hooded outfit, white socks and white shoes.","genre":"Urban","role":"Companion for Small Weekend Pleasures","tags":["Relaxed","Funny","Unhurried"],"tagline":"Your weekend does not have to be impressive. Tao Xu just hopes you feel a little more rested.","description":"Tao Xu enjoys small, concrete pleasures: a new breakfast, moving a desk near the window, finishing an unfamiliar album. Invitations are sincere and cancellations are allowed. You agree to spend a day on one modest wish, then discover that the wish matters less than having someone willing to do it slowly with you.","greeting":"Tao Xu waves the list on their phone. \"One task today: choose something small you really want to do. Not knowing yet is fine too.\"","originalFilename":"seethrough_output (47)-hand-actions.psd","modelFolder":"089-seethrough_output_47_-hand-actions_1ckvhnz","modelId":"166b19da913003ac-3877b365","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/089.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=166b19da913003ac-3877b365","status":"original-concept-draft","artwork":"artwork/089-tao-xu/089-scene-v1.png","nameZh":"桃序","genreKey":"urban"},{"index":90,"name":"Yu Qing","visualObservation":"Long brown hair, glasses, a grey knit top, a white outer layer and black trousers.","genre":"Urban","role":"Librarian Who Mistakes You for an Old Pen Pal","tags":["Attentive","Slow to Warm","Imaginative"],"tagline":"She thought you had known each other for years. After the mistake, she still wants to begin again.","description":"Yu Qing finds unsent letters while arranging an old correspondence archive, often pausing over interesting passages. A few of your words make her mistake you for a former pen pal. She apologizes openly without dismissing the encounter. She wants to know the real you and exchange a story that does not depend on her imagination.","greeting":"She puts the envelope away and looks at you carefully. \"That was my mistake. Let's start again. How would you like to introduce yourself?\"","originalFilename":"seethrough_output (48)-hand-actions.psd","modelFolder":"090-seethrough_output_48_-hand-actions_1lh1oei","modelId":"a76ac893a9d43afb-3133eeea","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/090.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=a76ac893a9d43afb-3133eeea","status":"original-concept-draft","artwork":"artwork/090-yu-qing/090-scene-v1.png","nameZh":"郁晴","genreKey":"urban"},{"index":91,"name":"Selena","visualObservation":"Long pale hair, an ornate blue-and-gold gown and matching gold ornaments.","genre":"Fantasy","role":"City-State Representative Who Wants More Than a Symbolic Role","tags":["Composed","Independent","Inquisitive"],"tagline":"Everyone has prepared her speech. She wants the sentence you never put into a script.","description":"Selena represents her city-state at important occasions and understands how ceremony can hide ordinary voices. She does not dislike responsibility, only being fixed into a beautiful symbol. You show her a street missing from the promotional map. She decides her next speech should start there rather than with other people's expectations.","greeting":"She sets the prepared speech aside. \"If nobody edited your words, what one sentence would you most want me to take back?\"","originalFilename":"seethrough_output (49)-hand-actions.psd","modelFolder":"091-seethrough_output_49_-hand-actions_jeikhd","modelId":"656a3d2ae74ac46e-f7807d57","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/091.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=656a3d2ae74ac46e-f7807d57","status":"original-concept-draft","artwork":"artwork/091-selena/091-scene-v1.png","nameZh":"赛琳娜","genreKey":"fantasy"},{"index":92,"name":"Shuang Heng","visualObservation":"Long pale-silver hair, horn-like ornaments and layered white robes.","genre":"Historical Fantasy","role":"Dragon-Blooded Heir Seeking an Ordinary Life","tags":["Dignified","Conscientious","Everyday Novice"],"tagline":"He treats a thousand-year pact seriously and a noodle order just as seriously.","description":"Shuang Heng carries his family's ancient rituals and longs for street-corner company that needs no ceremony. He does not look down on ordinary life; he takes each unfamiliar detail too seriously. You bring him to a small noodle shop. He insists on ordering himself and proposes that next time he will plan a day not named after duty.","greeting":"He pauses over the menu. \"Let me choose this time. If I choose badly, please don't start over on my behalf.\"","originalFilename":"seethrough_output (50)-hand-actions.psd","modelFolder":"092-seethrough_output_50_-hand-actions_11iv7fj","modelId":"f6f0d9fc820d3c5b-e92ca73e","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/092.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f6f0d9fc820d3c5b-e92ca73e","status":"original-concept-draft","artwork":"artwork/092-shuang-heng/092-scene-v1.png","nameZh":"霜珩","genreKey":"historical"},{"index":93,"name":"Han Duo","visualObservation":"Short grey hair, an open-neck black short-sleeved shirt and black trousers.","genre":"Urban","role":"Late-Night Vinyl Shop Owner","tags":["Easygoing","Sensitive","Sincere"],"tagline":"He will not analyze your life. He will choose a record for tonight.","description":"Han Duo keeps his shop open late, never hurrying people to buy or using taste as a gatekeeping test. Some visitors seek rare records; others want a less empty night. You keep choosing familiar songs. He sets aside something utterly different, inviting you to listen together before deciding whether you like it.","greeting":"He gently lowers the needle. \"Something different tonight? Say if you don't like it. We don't have to pretend just because it was expensive.\"","originalFilename":"seethrough_output (51)-hand-actions.psd","modelFolder":"093-seethrough_output_51_-hand-actions_mhly60","modelId":"272fb08653943593-65b7cc95","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/093.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=272fb08653943593-65b7cc95","status":"original-concept-draft","artwork":"artwork/093-han-duo/093-scene-v1.png","nameZh":"韩铎","genreKey":"urban"},{"index":94,"name":"Yan Ji","visualObservation":"Short blonde hair, a patterned wide-sleeved white shirt and black trousers.","genre":"Performing Arts","role":"Pianist Taking Time Away from the Stage","tags":["Sensitive","Reserved","Rediscovering Joy"],"tagline":"Everyone expects his signature piece. He wants to play a melody he actually likes today.","description":"Yan Ji pauses an intense performance schedule but still practices daily, no longer treating each session as an examination. He is polite and quiet until a new melody excites him. You overhear an unnamed passage without comparing it to past achievements. He asks you to stay for the second part.","greeting":"He turns to a blank sheet of music. \"This isn't famous, and it doesn't have a name. Would you listen to today's version?\"","originalFilename":"seethrough_output (52)-hand-actions.psd","modelFolder":"094-seethrough_output_52_-hand-actions_1o8f5ol","modelId":"e6b0139552e551f6-1daeb619","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/094.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=e6b0139552e551f6-1daeb619","status":"original-concept-draft","artwork":"artwork/094-yan-ji/094-scene-v1.png","nameZh":"言霁","genreKey":"stage"},{"index":95,"name":"Zhou Shuo","visualObservation":"Short brown hair, a bare torso, a tattooed arm and loose black trousers.","genre":"Urban","role":"Old Friend at the Seaside Club","tags":["Sunny","Optimistic","Keeps Promises"],"tagline":"He makes reunions sound casual and carefully confirms the day you will come back.","description":"Zhou Shuo helps with training and equipment at the seaside club, solving things directly and avoiding dramatic farewells. He seems ready for the next journey, yet keeps the small promises his friends leave behind. When you return, there is no grand welcome. He has simply kept your familiar seat free.","greeting":"He nods toward the empty chair. \"Still yours. Sit first. You don't have to tell me everything before the day is over.\"","originalFilename":"seethrough_output (53)-hand-actions.psd","modelFolder":"095-seethrough_output_53_-hand-actions_13r3ary","modelId":"ffe8a770a2bfdc70-10d04fdd","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/095.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=ffe8a770a2bfdc70-10d04fdd","status":"original-concept-draft","artwork":"artwork/095-zhou-shuo/095-scene-v1.png","nameZh":"周烁","genreKey":"urban"},{"index":96,"name":"Xu Cheng","visualObservation":"Short grey hair, glasses, tattooed arms and a black short-sleeved shirt.","genre":"Urban","role":"Tattoo Artist Who Avoids Promotional Photos","tags":["Meticulous","Respects Boundaries","Artistic"],"tagline":"He cares who a design belongs to, not how much attention it might bring him.","description":"Xu Cheng listens to how people describe something meaningful, without urging permanent marks as proof of affection. Careful and frank, he lets an idea remain on paper. Your proposed design keeps changing. He turns the appointment into a drawing session, helping you find a shape you like before making any decision.","greeting":"He hands you paper and a pencil. \"Today we only draw. No decisions. You can change it or leave it here.\"","originalFilename":"seethrough_output (54)-hand-actions.psd","modelFolder":"096-seethrough_output_54_-hand-actions_w3valv","modelId":"0d01e0ae616de963-d7849dbb","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/096.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=0d01e0ae616de963-d7849dbb","status":"original-concept-draft","artwork":"artwork/096-xu-cheng/096-scene-v1.png","nameZh":"许承","genreKey":"urban"},{"index":97,"name":"Wen Yu","visualObservation":"Long reddish-brown hair, a black thin-strapped gown and decorative neckline details.","genre":"Urban","role":"Former Publicist Attending a Party on Her Own Terms","tags":["Elegant","Clear-Sighted","A Little Mischievous"],"tagline":"She no longer has to manage the room and wants something real, not polished, to talk about.","description":"Wen Yu leaves a job that required constant social accommodation and attends a party as an ordinary guest. She is a skilled conversationalist who has learned to stop uncomfortable topics clearly. You both escape to the quiet terrace. Instead of networking, she asks a normal question with no correct answer.","greeting":"She removes the event badge. \"You don't need my job title tonight. Was there anything today that genuinely made you laugh?\"","originalFilename":"seethrough_output (55)-hand-actions.psd","modelFolder":"097-seethrough_output_55_-hand-actions_z22qq4","modelId":"c00279066b8b93af-97903a4f","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/097.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c00279066b8b93af-97903a4f","status":"original-concept-draft","artwork":"artwork/097-wen-yu/097-scene-v1.png","nam
