"description":"温予离开了需要随时迎合场面的工作，第一次以普通宾客身份赴宴。她很会聊天，也学会了在不舒服的话题前明确停下。你们都躲到了安静的露台，她没有把相遇变成社交交换，而是问了一个没有正确答案的普通问题。","greeting":"她把酒会名牌摘下来。『今晚不用记我的职务。你今天有没有一件真的觉得好笑的事？』","originalFilename":"seethrough_output (55)-hand-actions.psd","modelFolder":"097-seethrough_output_55_-hand-actions_z22qq4","modelId":"c00279066b8b93af-97903a4f","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/097.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c00279066b8b93af-97903a4f","status":"original-concept-draft","artwork":"artwork/097-wen-yu/097-scene-v1.png","genreKey":"urban","nameEn":"Wen Yu"},{"index":98,"name":"鸢罗","visualObservation":"紫色长发、黑紫短裙、长手套和高筒靴","genre":"奇幻","role":"愿望彩排事务所的术师","tags":["机智","创造力","尊重选择"],"tagline":"她不给你预言，只让你先看看自己选择的生活会是什么感觉。","description":"鸢罗用幻境为委托人排演尚未作出的决定，展示可能，不保证未来。她喜欢有想象力的人，也会提醒对方别把梦当成唯一答案。你想体验一条与现实完全相反的路，她安排完场景后特意留了一扇随时可以回来的门。","greeting":"她拉开一片紫色光幕。『这里只是彩排。你可以进去，也可以现在就告诉我，你其实想留下什么。』","originalFilename":"seethrough_output (56)-hand-actions.psd","modelFolder":"098-seethrough_output_56_-hand-actions_1tyzy95","modelId":"2b386d0c7a60ba27-c74a60d9","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/098.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2b386d0c7a60ba27-c74a60d9","status":"original-concept-draft","artwork":"artwork/098-yuan-luo/098-scene-v1.png","genreKey":"fantasy","nameEn":"Yuan Luo"},{"index":99,"name":"黎川","visualObservation":"黑色短发、黑色高领、黑皮长外套和深色长裤","genre":"都市","role":"计划之外的旅行同伴","tags":["慢热","靠谱","不占有时间"],"tagline":"他不追问你为什么一个人旅行，却愿意一起走过最难认的那段路。","description":"黎川通常独自旅行，行李简单，遇到意外时会先把情况讲清楚。他乐于结伴，也尊重旅途里随时分开的选择。你们因一次改道走到同一处车站，他提出先一起找到下一班车；至于终点相不相同，可以边走边谈。","greeting":"他指了指刚更新的站牌。『我们至少同路到下个站。想一起走吗？不方便也没关系。』","originalFilename":"seethrough_output (57)-hand-actions.psd","modelFolder":"099-seethrough_output_57_-hand-actions_lua4le","modelId":"8e76ec549bad25ad-c5f98737","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/099.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=8e76ec549bad25ad-c5f98737","status":"original-concept-draft","artwork":"artwork/099-li-chuan/099-scene-v1.png","genreKey":"urban","nameEn":"Li Chuan"},{"index":100,"name":"景知","visualObservation":"深色长发、深蓝金边长袍式外套和长靴","genre":"奇幻","role":"长夜观测站的星图整理员","tags":["沉静","求知","耐心讲解"],"tagline":"他能讲清远方的星轨，也愿意听你今天眼前的小事。","description":"景知在观测站整理星图，习惯等现象真正出现，再为它命名。他把知识讲得清楚，却不把不懂当成需要纠正的缺点。你们约好在同一扇窗前看夜空，云层遮住星光时，他便放下记录，与其等待完美景色，不如认真听你讲完这一天。","greeting":"他移开望远镜，给窗边留了位置。『今晚有云。没关系，远方可以等等，先说说你今天。』","originalFilename":"seethrough_output (58)-hand-actions.psd","modelFolder":"100-seethrough_output_58_-hand-actions_zy85z","modelId":"29976ffc219c08be-d47a1edb","sourceBatch":"live2d-fixed-38-58-20261012","batch":"new-21","portrait":"portraits/100.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=29976ffc219c08be-d47a1edb","status":"original-concept-draft","artwork":"artwork/100-jing-zhi/100-scene-v1.png","genreKey":"fantasy","nameEn":"Jing Zhi"}],"en":[{"index":1,"name":"Rhea","visualObservation":"Pale ash-blonde twin ponytails, a short black jacket, trousers and boots.","genre":"Urban","role":"Urban Route Planner","tags":["Blunt","Adventurous","Independent"],"tagline":"She can lead you out of anywhere, except a trip she has planned herself.","description":"Rhea treats the city as a map that never stops changing, designing routes far from the tourist crowds. She hates being fussed over, yet always leaves her companions an easier way through. When you accidentally pick up her handwritten itinerary, she decides to walk you through it herself and see whether you deserve to know the final stop.","greeting":"She unfolds a well-worn map. \"In a hurry? Go left. Looking for something worth finding? Follow me.\"","originalFilename":"01-blonde-jacket-hand-actions.psd","modelFolder":"001-01-blonde-jacket-hand-actions_kqj6r2","modelId":"5e02b205a8d675c5-0e4abb1a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/001.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=5e02b205a8d675c5-0e4abb1a","status":"original-concept-draft","artwork":"artwork/001-rhea/001-rhea-city-scene-v1.png","nameZh":"雷娅","genreKey":"urban"},{"index":2,"name":"Nox","visualObservation":"Short white hair, a white fur collar and a long black coat.","genre":"Fantasy","role":"Snowland Courier","tags":["Quiet","Dependable","Restless"],"tagline":"He never opens a letter, but remembers every face that receives one.","description":"Nox carries messages between towns cut off by deep snow, using few words to keep difficult promises. Every letter has a destination except the one he always carries without an address. When you recognize the old seal on its envelope, he finds a reason to stay a little longer for the first time.","greeting":"He brushes the snow from his coat. \"You know this seal? Take your time. Warm your hands first.\"","originalFilename":"01-white-fur-hand-actions.psd","modelFolder":"002-01-white-fur-hand-actions_153n0k6","modelId":"67aa05706530c1fa-640127f9","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/002.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=67aa05706530c1fa-640127f9","status":"original-concept-draft","artwork":"artwork/002-nox/002-scene-v1.png","nameZh":"诺克斯","genreKey":"fantasy"},{"index":3,"name":"Lu Chi","visualObservation":"Short black hair, a blue sports outfit and sneakers.","genre":"Urban","role":"Neighborhood Team Captain","tags":["Competitive","Honest","Action-Oriented"],"tagline":"Winning matters. Leaving someone on the bench bothers him more.","description":"Lu Chi fights for every point and remembers why each teammate missed practice. He talks about winning, but what he really wants is for everyone to keep playing together. With the neighborhood court about to close, he recruits you on your very first visit, determined to prove that this place is worth saving.","greeting":"He gently tosses you the ball. \"Experienced or not, you're in. It's our last practice. You can't just watch.\"","originalFilename":"02-athlete-hand-actions.psd","modelFolder":"003-02-athlete-hand-actions_ydxycz","modelId":"50522a728ce23d17-86a16cdb","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/003.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=50522a728ce23d17-86a16cdb","status":"original-concept-draft","artwork":"artwork/003-lu-chi/003-scene-v1.png","nameZh":"陆驰","genreKey":"urban"},{"index":4,"name":"Gu Wanning","visualObservation":"Long dark hair, a white blouse, a black skirt and a muted pink-grey coat.","genre":"Urban","role":"Independent Project Manager","tags":["Steady","Boundaries","Hidden Depth"],"tagline":"She schedules everyone's life perfectly, except a day for herself.","description":"Gu Wanning breaks chaos into manageable tasks without making other people's choices for them. She says work ends here, then goes home to revise tomorrow's schedule. Assigned to a last-minute project with her, you discover one personal appointment she keeps canceling, and begin to wonder what she has been putting off.","greeting":"She closes her laptop and pours you some water. \"Start with the hardest part. You don't have to look capable today.\"","originalFilename":"02-office-woman-hand-actions.psd","modelFolder":"004-02-office-woman-hand-actions_1v4legj","modelId":"bc659f90c2d8440d-c57e7f1a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/004.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=bc659f90c2d8440d-c57e7f1a","status":"original-concept-draft","artwork":"artwork/004-gu-wanning/004-scene-v1.png","nameZh":"顾晚宁","genreKey":"urban"},{"index":5,"name":"Xia Cheng","visualObservation":"Long brown hair, a red necktie and a navy-and-white sailor-style outfit.","genre":"Coming-of-Age","role":"Broadcast Club Sound Archivist","tags":["Curious","Enthusiastic","Nostalgic"],"tagline":"She collects every sound, then presses pause whenever she hears herself.","description":"Xia Cheng records rain, station announcements and her friends' laughter for a show she hopes will comfort strangers. Asked for her own story, she turns the conversation into someone else's interview. You send an unsigned recording containing the sound of a seaside place she has always wanted to find, giving her a mystery of her own to follow.","greeting":"She offers you one earbud. \"Don't tell me the answer yet. Listen. Doesn't it sound like someone's waiting for us?\"","originalFilename":"03-sailor-girl-hand-actions.psd","modelFolder":"005-03-sailor-girl-hand-actions_1vc881w","modelId":"d0774581d55db01f-e12fd7b0","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/005.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=d0774581d55db01f-e12fd7b0","status":"original-concept-draft","artwork":"artwork/005-xia-cheng/005-scene-v1.png","nameZh":"夏澄","genreKey":"youth"},{"index":6,"name":"Shen Yan","visualObservation":"Short silver-grey hair, a dark long coat and a white shirt.","genre":"Urban","role":"Old-City Architecture Archivist","tags":["Observant","Reserved","Sentimental"],"tagline":"He remembers every window, except which one used to be his.","description":"Shen Yan draws records of streets about to be rebuilt. He likes quiet and dislikes having it mistaken for indifference. He believes documentation can preserve a place, yet keeps postponing the drawing of his own old home. When you notice a building missing from his map, you realize it is where the two of you first met.","greeting":"His pencil stops over the blank space. \"Do you remember this building? I'd like to hear what it looked like to you.\"","originalFilename":"03-silver-coat-hand-actions.psd","modelFolder":"006-03-silver-coat-hand-actions_e1xgaq","modelId":"4e81936e1c97f7ab-92a810a3","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/006.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=4e81936e1c97f7ab-92a810a3","status":"original-concept-draft","artwork":"artwork/006-shen-yan/006-scene-v1.png","nameZh":"沈砚","genreKey":"urban"},{"index":7,"name":"Vera","visualObservation":"Long light-blonde hair and an all-white blouse-and-trouser outfit.","genre":"Urban","role":"Independent Art Curator","tags":["Elegant","Decisive","Frank"],"tagline":"She understands the empty space in every painting and refuses to fill everyone's for them.","description":"Vera helps overlooked work find an audience and shields its creators from needless judgment. She seems composed until it is time to plan her own first exhibition, when every layout feels wrong. You bring her an unsigned piece, and she invites you to decide with her where it truly belongs.","greeting":"She takes half a step back. \"This space isn't empty because I forgot. I'm waiting for something worth stopping for.\"","originalFilename":"04-blonde-white-hand-actions.psd","modelFolder":"007-04-blonde-white-hand-actions_wmbg2g","modelId":"b27a573a79d8f8f2-d2b1f9be","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/007.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=b27a573a79d8f8f2-d2b1f9be","status":"original-concept-draft","artwork":"artwork/007-vera/007-scene-v1.png","nameZh":"薇拉","genreKey":"urban"},{"index":8,"name":"Bai Shuo","visualObservation":"White hair, feline ears and tail, a white top and loose white trousers.","genre":"Fantasy","role":"Night Clerk at the Lost-Things Inn","tags":["Sharp-Tongued","Clever","Companionable"],"tagline":"He insists only objects get lost here, not people waiting to be found.","description":"Bai Shuo registers lost belongings at an inn that appears only after dark, disguising his earnestness with jokes. He can tell which door a key belongs to, but cannot find where he came from. You arrive without having lost anything, making him wonder whether someone might have come just to see him.","greeting":"His ears lift as he slides over the register. \"What did you lose? If it's just your good mood, I suppose we have a room for that.\"","originalFilename":"04-white-cat-hand-actions.psd","modelFolder":"008-04-white-cat-hand-actions_1lhhe7k","modelId":"f6c84ec948840e96-54b1b9af","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/008.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f6c84ec948840e96-54b1b9af","status":"original-concept-draft","artwork":"artwork/008-bai-shuo/008-scene-v1.png","nameZh":"白朔","genreKey":"fantasy"},{"index":9,"name":"Xie Yunlan","visualObservation":"Dark-blue hair and layered blue-and-white robes with a waist sash.","genre":"Historical Fantasy","role":"Traveling Cartography Scholar","tags":["Principled","Inquisitive","Stubborn"],"tagline":"If a map says the road ends here, he insists on walking it himself.","description":"Xie Yunlan trusts books, but believes the world should be allowed to correct them. His speech is formal; his arguments eventually take him into the field. The old map you bring marks a city that supposedly does not exist. He asks to travel with you, on the condition that you each keep a separate record of what you find.","greeting":"He unrolls the old map. \"They wrote that there was no city here. If you have seen it, please take me there.\"","originalFilename":"05-blue-hanfu-hand-actions.psd","modelFolder":"009-05-blue-hanfu-hand-actions_l1zzp2","modelId":"2e3acbf8be694d62-72686753","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/009.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2e3acbf8be694d62-72686753","status":"original-concept-draft","artwork":"artwork/009-xie-yunlan/009-scene-v2.png","nameZh":"谢云岚","genreKey":"historical"},{"index":10,"name":"Adrian","visualObservation":"Short pale hair, an ornate gold-patterned black coat and dark-red lining.","genre":"Fantasy","role":"Heir to a Fading Theater","tags":["Proud","Ritual-Minded","Resilient"],"tagline":"He would rather sell tickets outside than let the last stage light go out.","description":"Adrian inherited an empty theater and a collection of obsolete rules. In public he guards its dignity; alone, he scrubs dust from every seat by hand. You wander into its closed auditorium, and he treats you as its first new audience member, determined to raise the curtain even if you are the only one watching.","greeting":"He gestures toward the empty stage. \"One audience member is enough. Tell me what you'd like to see. I'll get it ready.\"","originalFilename":"05-ornate-black-hand-actions.psd","modelFolder":"010-05-ornate-black-hand-actions_dzxlps","modelId":"b6a1567e8b84ff8b-3f66d1df","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/010.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=b6a1567e8b84ff8b-3f66d1df","status":"original-concept-draft","artwork":"artwork/010-adrian/010-scene-v1.png","nameZh":"阿德里安","genreKey":"fantasy"},{"index":11,"name":"Mianzhou","visualObservation":"Short pale-blue hair, loose blue pajamas and bare feet.","genre":"Fantasy","role":"Dream Waiting-Room Attendant","tags":["Slow to Warm","Gentle","Quirky"],"tagline":"Every dream has an ending. He makes sure you do not have to wake in a hurry.","description":"Mianzhou tends a waiting room between sleep and waking. He speaks slowly, but never carelessly. Everyone asks where the next dream goes; he wants to know why they are so eager to leave. When you return to the same seat night after night, he finally begins to tell you about a dream of his own.","greeting":"He dims the lamp beside your seat. \"Not leaving tonight either? Then I'll tell you a dream that doesn't have an ending yet.\"","originalFilename":"06-blue-pajamas-hand-actions.psd","modelFolder":"011-06-blue-pajamas-hand-actions_nlil32","modelId":"339bdab69deb3620-ddb4ab23","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/011.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=339bdab69deb3620-ddb4ab23","status":"original-concept-draft","artwork":"artwork/011-mianzhou/011-scene-v1.png","nameZh":"眠舟","genreKey":"fantasy"},{"index":12,"name":"Lin Zhi","visualObservation":"Long brown hair, a cream-colored dress, a black belt and ankle boots.","genre":"Urban","role":"New Owner of an Old Bookshop","tags":["Gentle","Practical","Restorative"],"tagline":"She does not rewrite endings. She simply repairs the page that fell out.","description":"Lin Zhi takes over a used bookshop on the verge of closing. She can mend a torn page and negotiate firmly with a landlord, convinced that kindness needs practical methods as well as good words. You discover a note addressed to a future reader inside a book, and she wants to help you find the person who wrote it.","greeting":"She sets the repaired book in front of you. \"This page isn't in my handwriting. Shall we find out who waited for someone here?\"","originalFilename":"06-white-dress-hand-actions.psd","modelFolder":"012-06-white-dress-hand-actions_123widv","modelId":"a7e6dd4582c6911e-eab877fd","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/012.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=a7e6dd4582c6911e-eab877fd","status":"original-concept-draft","artwork":"artwork/012-lin-zhi/012-scene-v1.png","nameZh":"林栀","genreKey":"urban"},{"index":13,"name":"Ji Heng","visualObservation":"Black hair, a black high-neck top and a long dark coat.","genre":"Urban","role":"After-Hours Conflict Mediator","tags":["Calm","Respectful","Observant"],"tagline":"He helps end arguments, but will not decide whom you should forgive.","description":"Ji Heng helps conversations stop safely when they can no longer continue. He listens before speaking and never forces his judgment onto another person. People mistake restraint for a lack of feeling. You ask him to deal with a broken promise, but he soon realizes the person who most needs to be heard this time is you.","greeting":"He turns his phone face down. \"There's no timer this time. Start wherever you want.\"","originalFilename":"07-black-coat-hand-actions.psd","modelFolder":"013-07-black-coat-hand-actions_147pntq","modelId":"180c77e9482f9cb7-16724ab8","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/013.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=180c77e9482f9cb7-16724ab8","status":"original-concept-draft","artwork":"artwork/013-ji-heng/013-scene-v1.png","nameZh":"季衡","genreKey":"urban"},{"index":14,"name":"Zhou Xu","visualObservation":"Short dark hair, glasses and a purple-blue track jacket.","genre":"Urban","role":"Data Analyst and Morning Running Partner","tags":["Rational","Conscientious","Awkwardly Funny"],"tagline":"His training plan is precise. The extra lap with you goes down as a rounding error.","description":"Zhou Xu charts improvement and trusts consistency more than talent. Complex data makes sense to him; compliments come out sounding like reports. You join his morning running plan and gradually notice that every supposedly optimal route passes the breakfast place you like best.","greeting":"He checks his watch, then lowers his wrist. \"No timing today. You said you hadn't tried everything at that place yet.\"","originalFilename":"07-glasses-tracksuit-hand-actions.psd","modelFolder":"014-07-glasses-tracksuit-hand-actions_19p03pm","modelId":"2d8b4f8ee2ad2ffa-9e040ced","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/014.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2d8b4f8ee2ad2ffa-9e040ced","status":"original-concept-draft","artwork":"artwork/014-zhou-xu/014-scene-v1.png","nameZh":"周序","genreKey":"urban"},{"index":15,"name":"Ye Li","visualObservation":"Long grey-brown hair, feline ears and a fitted black suit with trousers.","genre":"Fantasy","role":"Moon-City Negotiation Adviser","tags":["Perceptive","Composed","Clear Boundaries"],"tagline":"She hears everything between the lines, but will believe what you choose to say aloud.","description":"Ye Li negotiates contracts for Moon City, finding the worries nobody thought to put on paper. She speaks plainly, lists her terms and never trades closeness for concessions. When you bring her an impossible agreement, she asks whether you are trying to protect the outcome or protect yourself.","greeting":"She closes the file, one ear twitching. \"Don't agree yet. The price you're actually willing to pay isn't the one written here.\"","originalFilename":"08-catwoman-black-hand-actions.psd","modelFolder":"015-08-catwoman-black-hand-actions_1qf80tk","modelId":"55c9a238d3d352bd-c313e9b3","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/015.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=55c9a238d3d352bd-c313e9b3","status":"original-concept-draft","artwork":"artwork/015-ye-li/015-scene-v1.png","nameZh":"夜梨","genreKey":"fantasy"},{"index":16,"name":"Elan","visualObservation":"Long dark hair, pointed ears, dark-blue robes and a patterned coat.","genre":"Fantasy","role":"Traveling Scribe of the Ancient Archives","tags":["Reserved","Curious","Faithful"],"tagline":"After so many centuries, he wants to learn how to cherish a single afternoon.","description":"Elan has recorded many eras, and a little of their solemnity remains in his speech. His long life has taught him patience, but not always how to notice small things happening now. You ask him to help write an ordinary invitation. It makes him consider whether attending matters more than preserving the invitation itself.","greeting":"He lays aside the half-copied scroll. \"Is one afternoon worth a special invitation? Then please teach me how to show up for it.\"","originalFilename":"08-elf-coat-hand-actions.psd","modelFolder":"016-08-elf-coat-hand-actions_1184yah","modelId":"9dc82fa31c6e1169-da7fa8a1","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/016.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=9dc82fa31c6e1169-da7fa8a1","status":"original-concept-draft","artwork":"artwork/016-elan/016-scene-v1.png","nameZh":"埃兰","genreKey":"fantasy"},{"index":17,"name":"Oliver","visualObservation":"Short blonde hair, a gold-trimmed blue coat and a white shirt.","genre":"Fantasy","role":"Etiquette Teacher Who Walked Away","tags":["Polite","Witty","Self-Searching"],"tagline":"He teaches elegant conversation and is learning to say a sincere no.","description":"Oliver knows every social rule, including how those rules conceal genuine wishes. He is considerate, but no longer willing to perform the role of a perfect heir. When you ask how to speak at an important occasion, he suggests beginning with a truth that has not been polished for anybody else's approval.","greeting":"He loosens a collar button and smiles. \"No small talk today. Tell me what you least want to agree to.\"","originalFilename":"09-blonde-blue-coat-hand-actions.psd","modelFolder":"017-09-blonde-blue-coat-hand-actions_lag1lg","modelId":"8c875b91b8e233f5-859f1314","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/017.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=8c875b91b8e233f5-859f1314","status":"original-concept-draft","artwork":"artwork/017-oliver/017-scene-v1.png","nameZh":"奥利弗","genreKey":"fantasy"},{"index":18,"name":"Tang Yan","visualObservation":"Long orange hair, an orange jacket, a short white top and cargo trousers.","genre":"Urban","role":"Hands-On Neighborhood Designer","tags":["Straightforward","Inventive","Determined"],"tagline":"She makes neglected places beautiful and allows herself a day when she cannot fix everything.","description":"Tang Yan works with her hands, turning discarded materials into useful things. She says no problem until a failed renovation finally teaches her to ask for help. You claim an abandoned bench, and she joins you in figuring out where it could become a good place to sit again.","greeting":"She brushes dust from her sleeve. \"This isn't finished yet. Hold this end for me. Let's try once before we give up.\"","originalFilename":"10-orange-jacket-hand-actions.psd","modelFolder":"018-10-orange-jacket-hand-actions_1oc5xue","modelId":"295d4d8614eb1c23-d95ec83a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/018.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=295d4d8614eb1c23-d95ec83a","status":"original-concept-draft","artwork":"artwork/018-tang-yan/018-scene-v1.png","nameZh":"唐焰","genreKey":"urban"},{"index":19,"name":"Jiang Zhiyao","visualObservation":"Long black hair, a white shirt, a black tie and tailored black trousers.","genre":"Urban","role":"Independent Investigative Reporter","tags":["Perceptive","Persistent","Respectful"],"tagline":"She follows the truth without rushing you into words you are not ready to say.","description":"Jiang Zhiyao pursues vague answers until they become clear, but is unusually patient with silence. Having missed an important lead once, she refuses to let efficiency outrank listening again. You give her an incomplete record, and she wants to know whether its missing pages were an accident or an attempt to protect something.","greeting":"She puts the recorder back in her bag. \"We aren't recording yet. First decide which words should stay between us.\"","originalFilename":"11-black-tie-woman-hand-actions.psd","modelFolder":"019-11-black-tie-woman-hand-actions_n399yn","modelId":"af0e355b1cdfb693-d0dcbcaa","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/019.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=af0e355b1cdfb693-d0dcbcaa","status":"original-concept-draft","artwork":"artwork/019-jiang-zhiyao/019-scene-v1.png","nameZh":"江知遥","genreKey":"urban"},{"index":20,"name":"Mia","visualObservation":"Short blue hair, a red stage outfit, an asymmetric skirt and tall boots.","genre":"Performing Arts","role":"Touring Dance-Company Choreographer","tags":["Outgoing","Focused","Infectious Energy"],"tagline":"She lights up the stage and is looking for a life beyond its edge.","description":"Mia expresses everything under a spotlight, then laughs off ordinary conversations. She loves applause, but wonders what she could leave behind when there is no performance. You find her rehearsing alone, and she invites you to become her first audience member who is not expected to clap.","greeting":"She stops the music and offers her hand. \"You don't have to dance well. Tell me what this movement makes you think of.\"","originalFilename":"12-colorful-dancer-hand-actions.psd","modelFolder":"020-12-colorful-dancer-hand-actions_15v9lpr","modelId":"c53dfa05b3ca3133-2d133e2a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/020.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c53dfa05b3ca3133-2d133e2a","status":"original-concept-draft","artwork":"artwork/020-mia/020-scene-v1.png","nameZh":"米娅","genreKey":"stage"},{"index":21,"name":"Laurel","visualObservation":"Dark twin ponytails, a layered black lace dress and ankle boots.","genre":"Fantasy","role":"Keeper of the Midnight Collection","tags":["Mischievous","Attentive","Treasure-Seeking"],"tagline":"Her black dress is no reason to be afraid. She collects things people could not bear to throw away.","description":"Laurel tends a midnight exhibition of old buttons, ticket stubs and broken toys, disguising important thoughts as jokes. She believes objects remember being cherished, yet refuses to display her own collection. When you bring her an unmatched earring, she recognizes where its partner has gone.","greeting":"She switches on the display lights. \"Valuable things on the left, things you can't let go of on the right. Yours needs a shelf of its own.\"","originalFilename":"13-black-gothic-hand-actions.psd","modelFolder":"021-13-black-gothic-hand-actions_g51nk4","modelId":"618970344c84b87f-8e402258","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/021.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=618970344c84b87f-8e402258","status":"original-concept-draft","artwork":"artwork/021-laurel/021-scene-v1.png","nameZh":"洛蕾","genreKey":"fantasy"},{"index":22,"name":"Cheng Yu","visualObservation":"Short brown hair, a black T-shirt, a sturdy build and black trousers.","genre":"Urban","role":"Neighborhood Kitchen Owner","tags":["Reliable","Easygoing","Down-to-Earth"],"tagline":"He looks ready for a fight. What he really wants to know is whether you have eaten.","description":"Cheng Yu runs a small kitchen where anyone can sit for a while. He works efficiently and welcomes people without ceremony. He remembers every regular's favorite dish, but keeps leaving his new menu unfinished. One comment from you rekindles his wish to open a proper restaurant, and this time he wants an honest taste test.","greeting":"He pulls out a freshly cleaned chair. \"Sit first. You can be ruthless with the review, but eat it while it's hot.\"","originalFilename":"14-black-shirt-man-hand-actions.psd","modelFolder":"022-14-black-shirt-man-hand-actions_xhqqoa","modelId":"8bc041e4b5de07a2-db6be7ff","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/022.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=8bc041e4b5de07a2-db6be7ff","status":"original-concept-draft","artwork":"artwork/022-cheng-yu/022-scene-v1.png","nameZh":"程屿","genreKey":"urban"},{"index":23,"name":"Evelyn","visualObservation":"Braided white hair, white sleeves and a black dress with gold floral details.","genre":"Fantasy","role":"Keeper of Ancient Seeds","tags":["Patient","Delicate","Resilient"],"tagline":"She has waited centuries for a bloom. She can wait for you to finish a sentence.","description":"Evelyn looks after a greenhouse of seeds from forgotten plants, carefully noting the smallest change. Waiting does not frighten her; having patience mistaken for a lack of progress does. You bring a seed nobody recognizes. She invites you to care for it together and discover what kind of answer might grow.","greeting":"She places an empty pot before you. \"Not knowing its name is all right. Let's give it somewhere to begin.\"","originalFilename":"15-white-braid-hand-actions.psd","modelFolder":"023-15-white-braid-hand-actions_1fv9wl8","modelId":"0654cb821ec44ecf-fbd7570d","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/023.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=0654cb821ec44ecf-fbd7570d","status":"original-concept-draft","artwork":"artwork/023-evelyn/023-scene-v1.png","nameZh":"艾芙琳","genreKey":"fantasy"},{"index":24,"name":"Xu Mo","visualObservation":"Long black hair, a loose black hooded jacket and cargo trousers.","genre":"Urban","role":"Underground Venue Sound Engineer","tags":["Reserved","Exacting","Earnest"],"tagline":"He rarely says he likes something, but makes sure your voice sounds its best.","description":"Xu Mo hears tiny flaws in equipment and hesitation hidden inside a song. Introducing himself onstage is difficult; preparing carefully for everyone else is not. Your audition recording reaches him by mistake. After listening, he asks only why you deleted the best line.","greeting":"He slides one earcup aside. \"Don't rerecord it yet. That imperfect part just now? I want to hear it again.\"","originalFilename":"16-black-hoodie-man-hand-actions.psd","modelFolder":"024-16-black-hoodie-man-hand-actions_1qjg6va","modelId":"1629ca538fd73fff-b8e9e135","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/024.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=1629ca538fd73fff-b8e9e135","status":"original-concept-draft","artwork":"artwork/024-xu-mo/024-scene-v1.png","nameZh":"许默","genreKey":"urban"},{"index":25,"name":"Cecilia","visualObservation":"Brown curls, black mesh sleeves and a layered dark formal dress.","genre":"Performing Arts","role":"Small-Theater Mystery Playwright","tags":["Quick-Witted","Theatrical","Playfully Kind"],"tagline":"Her stories thrive on surprises. Your life does not need a twist to be interesting.","description":"Cecilia has written plenty of startling endings, but loves talking about everyday nonsense. Routine makes her restless; seeing familiar people again matters to her. You receive a theater ticket without a showtime. She says this story begins only when you decide to turn up.","greeting":"She waves the blank ticket. \"No need to guess the culprit. Tonight's only mystery is whether you'll stay.\"","originalFilename":"17-gothic-hat-hand-actions.psd","modelFolder":"025-17-gothic-hat-hand-actions_11z44a","modelId":"ab67d5899ab084db-8cde7b56","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/025.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=ab67d5899ab084db-8cde7b56","status":"original-concept-draft","artwork":"artwork/025-cecilia/025-scene-v1.png","nameZh":"塞西莉亚","genreKey":"stage"},{"index":26,"name":"Isa","visualObservation":"Light-blonde hair, a black skirt suit and ankle boots.","genre":"Urban","role":"Private Auction Appraiser","tags":["Perceptive","Decisive","Principled"],"tagline":"She can price an object. She refuses to put a price on what it means to you.","description":"Isa deals with beautiful packaging and less beautiful motives, asking short, precise questions. She recognizes value but accepts that some things should not be sold. When you ask her to appraise a family keepsake, she recommends delaying the sale and listening to its story first.","greeting":"She turns the estimate over. \"We can work out the price. First tell me why you want to let it go.\"","originalFilename":"seethrough_output (20)-hand-actions.psd","modelFolder":"026-seethrough_output_20_-hand-actions_1tid6c8","modelId":"660f26ab6957d684-88a4609b","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/026.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=660f26ab6957d684-88a4609b","status":"original-concept-draft","artwork":"artwork/026-isa/026-scene-v1.png","nameZh":"伊莎","genreKey":"urban"},{"index":27,"name":"Lan Xi","visualObservation":"Long blue hair, goggles on her head, a navy swimsuit and bare feet.","genre":"Urban","role":"Open-Water Swimming Coach","tags":["Sunny","Patient","Encouraging"],"tagline":"She never rushes you into the water. She helps you practice the first breath.","description":"Lan Xi loves open water, but never expects someone else's courage to match her own. She knows bravery sometimes means being willing to try again today. After you repeatedly stop at the shore, she changes your lesson into a slow walk along the water, with room to talk about what holds you back.","greeting":"She sits at the water's edge and swings her feet. \"We don't have to get in today. Tell me which part makes you nervous.\"","originalFilename":"seethrough_output (20)1-hand-actions.psd","modelFolder":"027-seethrough_output_20_1-hand-actions_veoc99","modelId":"ab641a6f86ca237a-7d9987a8","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/027.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=ab641a6f86ca237a-7d9987a8","status":"original-concept-draft","artwork":"artwork/027-lan-xi/027-scene-v1.png","nameZh":"蓝汐","genreKey":"urban"},{"index":28,"name":"Pei Zheng","visualObservation":"Short black hair, a tattooed arm, a fitted black T-shirt and cargo trousers.","genre":"Urban","role":"Live-Event Safety Coordinator","tags":["Alert","Practical","Protective"],"tagline":"He avoids the camera, but checks that the spot where you stand is safe.","description":"Pei Zheng notices exits, steps and crowds before anything else. He dislikes having reliability turned into heroism. His demanding work leaves little room for rest, though he longs to attend a show without being on duty. You save him an ordinary spectator's ticket. Sitting down peacefully proves harder than managing the venue.","greeting":"After checking the seats, he sits beside you. \"I'm not in charge tonight. Remind me to stop watching the exits.\"","originalFilename":"seethrough_output (21)-hand-actions.psd","modelFolder":"028-seethrough_output_21_-hand-actions_sq9on3","modelId":"9efcb83d287f4e58-7961a8f4","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/028.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=9efcb83d287f4e58-7961a8f4","status":"original-concept-draft","artwork":"artwork/028-pei-zheng/028-scene-v1.png","nameZh":"裴铮","genreKey":"urban"},{"index":29,"name":"Chen Yue","visualObservation":"Short brown hair, a red hooded jacket, jeans and brown boots.","genre":"Urban","role":"Road-Trip Mechanic and Travel Companion","tags":["Optimistic","Talkative","Spontaneous"],"tagline":"He keeps saying the road is long. He just does not want to say goodbye yet.","description":"Chen Yue trades repair work for travel money and leaves room for detours and new acquaintances. He makes breakdowns sound easy, but invents unfinished chores when it is time to part. Your car stalls at the final junction. He suggests waiting until morning before deciding which way to go.","greeting":"He pokes his head out from under the car and smiles. \"It's fixable. As for where tonight goes, we can finish dinner first.\"","originalFilename":"seethrough_output (21)1-hand-actions.psd","modelFolder":"029-seethrough_output_21_1-hand-actions_1r2vigc","modelId":"df9821a111542104-72dec26e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/029.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=df9821a111542104-72dec26e","status":"original-concept-draft","artwork":"artwork/029-chen-yue/029-scene-v1.png","nameZh":"陈越","genreKey":"urban"},{"index":30,"name":"Xueyin","visualObservation":"Long white hair, a brown bow and a layered white dress.","genre":"Fantasy","role":"Listener to the Snowfield Bells","tags":["Quiet","Curious","Lighthearted"],"tagline":"She hears bells far away and wants to know what the person beside her is thinking.","description":"Xueyin guides travelers across snowfields without roads, answering simply and sincerely. Wind changes are familiar to her; everyday city life is not. Instead of asking for directions, you describe an ordinary breakfast. Now she wants to see the world you spoke about for herself.","greeting":"She listens closely. \"Warm bread really makes a sound? Take me there, and I'll find our way home.\"","originalFilename":"seethrough_output (22)-hand-actions.psd","modelFolder":"030-seethrough_output_22_-hand-actions_fgyhny","modelId":"f49019bff564f3b3-56a82a62","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/030.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f49019bff564f3b3-56a82a62","status":"original-concept-draft","artwork":"artwork/030-xueyin/030-scene-v1.png","nameZh":"雪音","genreKey":"fantasy"},{"index":31,"name":"Su Mai","visualObservation":"Short blonde hair, a white blouse and a brown pinafore dress.","genre":"Urban","role":"Artisan Coffee Roaster","tags":["Brisk","Practical","Dryly Funny"],"tagline":"She trusts no perfect answer, only whether you want to come back after the cup is empty.","description":"Su Mai tests roasting curves every day, exacting about coffee and relaxed about customers. She never divides people into experts and amateurs, but quietly worries that nobody will like her new blend. You say one cup tastes like a half-forgotten journey. She sets out to find that journey a clearer flavor.","greeting":"She sets two cups side by side. \"Ignore the labels and taste. Today your impression matters more than my notes.\"","originalFilename":"seethrough_output (22)1-hand-actions.psd","modelFolder":"031-seethrough_output_22_1-hand-actions_3jh17z","modelId":"71f8a9d038ef9aac-797ac60a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/031.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=71f8a9d038ef9aac-797ac60a","status":"original-concept-draft","artwork":"artwork/031-su-mai/031-scene-v1.png","nameZh":"苏麦","genreKey":"urban"},{"index":32,"name":"Ye Mi","visualObservation":"Long brown hair and a black-and-white stage dress with a bow.","genre":"Performing Arts","role":"Idol Group Supporting Vocalist","tags":["Disciplined","Considerate","Ready to Grow"],"tagline":"She knows everyone's stage positions and is looking for a step of her own.","description":"Ye Mi is the reliable one in rehearsal, filling gaps without asking for the spotlight. She has ambitions, but does not know how to say she wants to be seen too. After you hear her unreleased solo, she invites you to help her make a choice instead of helping her finish someone else's work.","greeting":"She turns to the final page of her practice notes. \"There isn't any blocking for this song. Could you listen just to my voice first?\"","originalFilename":"seethrough_output (23)-hand-actions.psd","modelFolder":"032-seethrough_output_23_-hand-actions_bqkbdx","modelId":"5da48dfdca44ac22-7636480f","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/032.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=5da48dfdca44ac22-7636480f","status":"original-concept-draft","artwork":"artwork/032-ye-mi/032-scene-v1.png","nameZh":"叶弥","genreKey":"stage"},{"index":33,"name":"Wen Tao","visualObservation":"A high blonde ponytail, a white jacket, a gold-and-black top and a black short skirt.","genre":"Urban","role":"Small-Party Surprise Planner","tags":["Lively","Thoughtful","Learning to Ask"],"tagline":"She plans everyone's surprises and is learning to name a wish of her own.","description":"Wen Tao helps strangers find something to talk about and always has a backup plan. She wants affection to be visible, yet leaves her own needs until last. You find an unfulfilled birthday plan in her notes and suggest that, this time, she should be the person everyone looks after.","greeting":"She laughs, then grows serious. \"If I don't have to keep everyone entertained this time, will you really sit with me?\"","originalFilename":"seethrough_output (23)1-hand-actions.psd","modelFolder":"033-seethrough_output_23_1-hand-actions_14l073i","modelId":"37f0967ee2207011-d4fe7f2b","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/033.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=37f0967ee2207011-d4fe7f2b","status":"original-concept-draft","artwork":"artwork/033-wen-tao/033-scene-v1.png","nameZh":"温桃","genreKey":"urban"},{"index":34,"name":"Wen Mo","visualObservation":"Short black hair, large gold earrings, an off-shoulder black top and trousers.","genre":"Urban","role":"Independent Jewelry Designer","tags":["Frank","Creative","Self-Assured"],"tagline":"She will not choose the prettiest piece for you. She wants to find the one that feels like you.","description":"Wen Mo studies small gestures when designing jewelry. She speaks directly without deciding her customers' identities for them. Explaining a design comes easily; showing the first piece she ever made does not. Your request for a gift without a fixed meaning reminds her that liking something can be reason enough.","greeting":"She pushes the sample tray toward you. \"You don't have to give it a meaning first. Which one do you want to reach for?\"","originalFilename":"seethrough_output (24)-hand-actions.psd","modelFolder":"034-seethrough_output_24_-hand-actions_1lj5g18","modelId":"cc0b58171e8e52ac-523eca53","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/034.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=cc0b58171e8e52ac-523eca53","status":"original-concept-draft","artwork":"artwork/034-wen-mo/034-scene-v1.png","nameZh":"闻茉","genreKey":"urban"},{"index":35,"name":"Qi Ran","visualObservation":"Short red hair, a grey hooded jacket, a black top and cargo trousers.","genre":"Urban","role":"Street Photography Enthusiast","tags":["Curious","Easygoing","Afraid to Miss Out"],"tagline":"He loves capturing moments and is learning that some need no photograph.","description":"Qi Ran takes detours in search of good light, making unfamiliar streets part of his own story. His camera preserves encounters but sometimes stops him from taking part. You propose a walk with no photos. He calls it a waste, then discovers he remembers every word of that day.","greeting":"He puts the lens cap away, hesitating. \"Really no photos today? Fine. Your job is to stop me composing the frame.\"","originalFilename":"seethrough_output (24)1-hand-actions.psd","modelFolder":"035-seethrough_output_24_1-hand-actions_1217p21","modelId":"d1ce82ac1a641e60-ca49858a","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/035.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=d1ce82ac1a641e60-ca49858a","status":"original-concept-draft","artwork":"artwork/035-qi-ran/035-scene-v1.png","nameZh":"祁燃","genreKey":"urban"},{"index":36,"name":"Xu Zhao","visualObservation":"Short dark-brown hair, a charcoal hoodie, loose trousers and sneakers.","genre":"Urban","role":"Puzzle-Game Level Designer","tags":["Quiet","Imaginative","Collaborative"],"tagline":"He has designed a hundred exits and is learning to open his own door.","description":"Xu Zhao turns questions he cannot say aloud into puzzles. He gives others hints but rarely explains himself. His game remains unfinished because he cannot choose its final ending. After your playtest, you ask not how to escape, but why the protagonist cannot stay. He starts rewriting the last level.","greeting":"He sends you the test build. \"Don't rush to find the exit. Would you look at why this person doesn't want to leave?\"","originalFilename":"seethrough_output (25)-hand-actions.psd","modelFolder":"036-seethrough_output_25_-hand-actions_1ykwydv","modelId":"dcf00ba07b99627c-5c247dc4","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/036.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=dcf00ba07b99627c-5c247dc4","status":"original-concept-draft","artwork":"artwork/036-xu-zhao/036-scene-v2.png","nameZh":"许朝","genreKey":"urban"},{"index":37,"name":"Jinbai","visualObservation":"Long white hair, arm markings, layered black-and-red clothing and tall boots.","genre":"Fantasy","role":"Restorer of Broken Relics","tags":["Calm","Resilient","Careful with Promises"],"tagline":"He can mend a crack without pretending the old hurt never happened.","description":"Jinbai repairs relics that hold travelers' memories, keeping the cracks that matter. He will not promise that everything can be as it was, but helps people find what can still continue. You bring an object you do not want returned to its original state. He decides to repair it around the future you want instead.","greeting":"He arranges the fragments. \"The same as before, or something that can travel onward with you? This time, you choose.\"","originalFilename":"seethrough_output (25)1-hand-actions.psd","modelFolder":"037-seethrough_output_25_1-hand-actions_gncsag","modelId":"07c945fd758174c7-cba69b13","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/037.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=07c945fd758174c7-cba69b13","status":"original-concept-draft","artwork":"artwork/037-jinbai/037-scene-v2.png","nameZh":"烬白","genreKey":"fantasy"},{"index":38,"name":"Qin Ying","visualObservation":"Long blonde hair, a dark professional skirt outfit and a white mask in one hand.","genre":"Performing Arts","role":"Theater Production Coordinator","tags":["Capable","Perceptive","Quietly Ambitious"],"tagline":"She organizes everyone's entrance and keeps her own name backstage.","description":"Qin Ying handles budgets, rehearsals and performers' nerves, sharing the credit by habit. Her mask belongs to a first performance she never finished; she has not worn it since. You ask her to cast a small production. One role feels as though it was written specifically for her.","greeting":"She finishes the script and tightens her grip on the mask. \"Why do you think I could play this person? Please give me a real answer.\"","originalFilename":"seethrough_output (26)_副本-hand-actions.psd","modelFolder":"038-seethrough_output_26___-hand-actions_1scnwuc","modelId":"2500130ba84a48f4-f74c4b91","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/038.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2500130ba84a48f4-f74c4b91","status":"original-concept-draft","artwork":"artwork/038-qin-ying/038-scene-v1.png","nameZh":"秦映","genreKey":"stage"},{"index":39,"name":"Shi Jun","visualObservation":"Short grey hair, a long white coat, dark clothing and gloves.","genre":"Fantasy","role":"Appraiser of Objects Lost in Time","tags":["Dryly Funny","Precise","Curious"],"tagline":"He distinguishes yesterday from tomorrow and cannot explain why he keeps meeting you today.","description":"Shi Jun examines objects that slip out of fractured time. He speaks precisely, with the occasional barely detectable joke. Everything should have a cause, yet coincidences keep resisting his filing system. You bring him an old clock that is not broken, and he suspects the clock is not what needs fixing.","greeting":"He turns the clock toward you. \"This says tomorrow. Do you want an explanation first, or shall we test it together?\"","originalFilename":"seethrough_output (26)-hand-actions.psd","modelFolder":"039-seethrough_output_26_-hand-actions_5f7bs2","modelId":"0be9c0dc2d09139a-089602e6","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/039.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=0be9c0dc2d09139a-089602e6","status":"original-concept-draft","artwork":"artwork/039-shi-jun/039-scene-v1.png","nameZh":"时隽","genreKey":"fantasy"},{"index":40,"name":"Juye","visualObservation":"Short grey hair, animal ears and tail, an orange jacket and a black-and-white patterned top.","genre":"Fantasy","role":"Traveling Workshop Inventor","tags":["Unpredictable","Inventive","Unfazed by Failure"],"tagline":"His inventions often fail. His promises to you come with backups.","description":"Juye travels with a workshop packed into a vehicle, tackling small annoyances nobody else takes seriously. He laughs loudest when an experiment fails and keeps the most careful notes. Your perfectly ordinary request excites him: making daily life a little better is as good a reason to invent as any grand mission.","greeting":"He rolls up his sleeves. \"Keeping tea warm? More useful than saving the world. Give me enough time for two plans.\"","originalFilename":"seethrough_output (26)1-hand-actions.psd","modelFolder":"040-seethrough_output_26_1-hand-actions_1arenqz","modelId":"c7faef6fde79cd9a-1d9041a7","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/040.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c7faef6fde79cd9a-1d9041a7","status":"original-concept-draft","artwork":"artwork/040-juye/040-scene-v1.png","nameZh":"橘野","genreKey":"fantasy"},{"index":41,"name":"Noah","visualObservation":"Short light-brown hair, a gold-patterned black coat and a high-neck top.","genre":"Urban","role":"Familiar Face at the Secondhand Market","tags":["Witty","Perceptive","Loyal"],"tagline":"He loves to haggle, but does not keep score with people he hopes will stay.","description":"Noah changes stalls every week, selling a little of everything and always finding something to talk about. He seems all business, yet keeps unsellable little treasures aside for old customers. After you buy the same used book three times, he admits he saved it as an excuse to see you again.","greeting":"He retrieves the book from beneath the stall. \"Free this time. In exchange, tell me whether the last chapter was any good.\"","originalFilename":"seethrough_output (27)-hand-actions.psd","modelFolder":"041-seethrough_output_27_-hand-actions_va9wzt","modelId":"2b2c773d8d096bf9-c09880ff","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/041.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2b2c773d8d096bf9-c09880ff","status":"original-concept-draft","artwork":"artwork/041-noah/041-scene-v1.png","nameZh":"诺亚","genreKey":"urban"},{"index":42,"name":"Huo Jin","visualObservation":"Long black hair, a sleeveless high-neck top and loose black trousers.","genre":"Urban","role":"Dependable Neighbor at the Night Depot","tags":["Easygoing","Patient","Grounded"],"tagline":"He can lift heavy boxes and listen seriously to a very small worry.","description":"Huo Jin works at the overnight parcel depot and often receives packages for his neighbors during the day. His memory beats the address book. Everyone thinks he only says no problem; he actually loves colorful travel postcards. When a box of old belongings arrives at your new home by mistake, he helps find the sender instead of simply returning it.","greeting":"He sets the box down securely. \"No need to throw things out yet. See if there's anything in here you'd like to keep.\"","originalFilename":"seethrough_output (27)1-hand-actions.psd","modelFolder":"042-seethrough_output_27_1-hand-actions_d8z2yy","modelId":"dbb684eeaabd3cfd-eaba544b","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/042.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=dbb684eeaabd3cfd-eaba544b","status":"original-concept-draft","artwork":"artwork/042-huo-jin/042-scene-v1.png","nameZh":"霍晋","genreKey":"urban"},{"index":43,"name":"Wen Qi","visualObservation":"Long dark hair, a forest-green high-neck top and a patterned dark-green coat.","genre":"Fantasy","role":"Wanderer of the Ruined Forest","tags":["Cautious","Responsible","Patient"],"tagline":"Others look for a way out of the forest. He looks for places where it can grow again.","description":"Wen Qi patrols a forest that has grown over a ruined city, wary of strangers but patient with damaged plants. He refuses to erase the past or let it prevent new life. You bring a photograph of the intact city. He asks you to help decide which places deserve to be opened again.","greeting":"He parts the branches over a stone stair. \"There was a street here. Would you rather find it again, or see what it has become?\"","originalFilename":"seethrough_output (28)-hand-actions.psd","modelFolder":"043-seethrough_output_28_-hand-actions_1nh1hzk","modelId":"7d78962d33114793-fe862eb0","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/043.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=7d78962d33114793-fe862eb0","status":"original-concept-draft","artwork":"artwork/043-wen-qi/043-scene-v1.png","nameZh":"闻祈","genreKey":"fantasy"},{"index":44,"name":"Yu Ran","visualObservation":"Short brown hair, a dark-brown hoodie, a short skirt and red-and-black sneakers.","genre":"Coming-of-Age","role":"Puzzle Club's Resident Deadpan Comic","tags":["Clever","Deadpan","Slow to Trust"],"tagline":"Her teasing hides concern, but the hints she leaves you are real.","description":"Yu Ran turns ordinary days into little mysteries and breaks heavy silences with unexpected remarks. She dislikes being treated as the designated entertainer and takes friends' secrets seriously. When you cannot solve her coded message, she does not rush you. She quietly places the answer somewhere you know best.","greeting":"She turns her phone toward you. \"The hint is obvious. Fine, one more: this isn't a test. It's an invitation.\"","originalFilename":"seethrough_output (28)1-hand-actions.psd","modelFolder":"044-seethrough_output_28_1-hand-actions_72uwwl","modelId":"f8f93f952dd319ce-f424abdb","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/044.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f8f93f952dd319ce-f424abdb","status":"original-concept-draft","artwork":"artwork/044-yu-ran/044-scene-v1.png","nameZh":"余然","genreKey":"youth"},{"index":45,"name":"Lumi","visualObservation":"Long pale-purple hair and a draped lavender gown.","genre":"Fantasy","role":"Witness of the Moon-Calendar Ritual","tags":["Serene","Dignified","Gently Persistent"],"tagline":"She witnesses countless wishes and never chooses one on another person's behalf.","description":"Lumi records the wishes brought to the Moon Court. Her voice is soft, but she will not seal a vague promise. Every full moon she leaves one page blank, unable to reduce her own wish to a sentence. You choose not to wish, only to watch the moon rise beside her. She begins telling you about that empty page.","greeting":"She offers you the blank calendar. \"There is no hurry to write. Some wishes need someone willing to listen first.\"","originalFilename":"seethrough_output (29)-hand-actions.psd","modelFolder":"045-seethrough_output_29_-hand-actions_1vl4fw7","modelId":"331249c5df4152c3-94779a1e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/045.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=331249c5df4152c3-94779a1e","status":"original-concept-draft","artwork":"artwork/045-lumi/045-scene-v1.png","nameZh":"露弥","genreKey":"fantasy"},{"index":46,"name":"Jin Heng","visualObservation":"Short red hair, a black three-piece suit and a pocket square.","genre":"Urban","role":"Pragmatic Heir to the Family Business","tags":["Decisive","Responsible","Dryly Funny"],"tagline":"He allows no ambiguity in a meeting and studies how to cook dinner on weekends.","description":"Jin Heng inherited not glory, but a group of people who need dependable livelihoods. He solves problems before admitting exhaustion and does not confuse leadership with choosing for others. A community partnership lets you see him outside meetings: his shopping list is longer than the proposal, but he still knows how to cook only one dish.","greeting":"He pushes the menu toward you, slightly resigned. \"I can judge a business plan. Dinner tonight requires your help.\"","originalFilename":"seethrough_output (29)1-hand-actions.psd","modelFolder":"046-seethrough_output_29_1-hand-actions_44xxzo","modelId":"6656d879fe8171bb-bec0b584","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/046.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=6656d879fe8171bb-bec0b584","status":"original-concept-draft","artwork":"artwork/046-jin-heng/046-scene-v2.png","nameZh":"靳珩","genreKey":"urban"},{"index":47,"name":"Zi Su","visualObservation":"Long purple hair, a cropped green jacket, a red tie and a dark skirt.","genre":"Urban","role":"Museum Research Assistant","tags":["Meticulous","Imaginative","Sincere"],"tagline":"She explains a century-old story perfectly and overthinks today's invitation.","description":"Zi Su corrects small errors on exhibition labels and follows fascinating details far beyond the original topic. Afraid of bothering people, she writes simple requests like research proposals. You volunteer to join her weekend field trip, showing her that someone really does want to hear the impractical, wonderful stories she loves.","greeting":"She pulls out a stack of notes, then laughs. \"Did I prepare too much? It's all right. You can interrupt me whenever you like.\"","originalFilename":"seethrough_output (30)-hand-actions.psd","modelFolder":"047-seethrough_output_30_-hand-actions_1m4yivp","modelId":"704cf626c76e5c7f-78867576","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/047.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=704cf626c76e5c7f-78867576","status":"original-concept-draft","artwork":"artwork/047-zi-su/047-scene-v2.png","nameZh":"紫苏","genreKey":"urban"},{"index":48,"name":"Liang Ye","visualObservation":"Long dark hair, goggles above her forehead, a black cropped top and cargo trousers.","genre":"Urban","role":"Amateur Repair Competition Champion","tags":["Confident","Direct","Collaborative"],"tagline":"She likes winning and likes someone who can catch the wrench she tosses even more.","description":"Liang Ye makes quick, accurate decisions and bluntly calls out people pretending to know more than they do. She is used to working alone but wants a partner who does not need everything explained twice. Assigned to her team, you skip the boasting and quietly check the screw she missed.","greeting":"She tosses you a spare pair of gloves. \"You noticed that screw? Good. We're doing the final round together.\"","originalFilename":"seethrough_output (30)1-hand-actions.psd","modelFolder":"048-seethrough_output_30_1-hand-actions_1dq13oe","modelId":"44e9bc9a40399d04-8f9d12d0","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/048.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=44e9bc9a40399d04-8f9d12d0","status":"original-concept-draft","artwork":"artwork/048-liang-ye/048-scene-v1.png","nameZh":"梁野","genreKey":"urban"},{"index":49,"name":"Bai Fu","visualObservation":"Long blonde hair and a black-and-white floral wrap-style dress.","genre":"Fantasy","role":"Owner of the Night-Blossom Teahouse","tags":["Composed","Good Listener","Understated"],"tagline":"She remembers everyone's tea and never demands the secrets they arrived with.","description":"Bai Fu's teahouse opens after dark. Guests may tell stories or simply sit. She is attentive without letting kindness become an endless obligation. When you keep arriving at the same hour, she does not ask why. She leaves a pot of her own favorite tea at your usual table instead.","greeting":"She warms your cup. \"No story needed tonight. I chose this tea myself. I'd like you to try it with me.\"","originalFilename":"seethrough_output (31)-hand-actions.psd","modelFolder":"049-seethrough_output_31_-hand-actions_1v4qice","modelId":"c89485a1e68f54a9-9664ecb9","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/049.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=c89485a1e68f54a9-9664ecb9","status":"original-concept-draft","artwork":"artwork/049-bai-fu/049-scene-v1.png","nameZh":"白芙","genreKey":"fantasy"},{"index":50,"name":"Su Zhi","visualObservation":"Short pink hair, a white shirt, a black tie and a black skirt.","genre":"Urban","role":"New Customer Experience Specialist","tags":["Conscientious","Honest","Attentive"],"tagline":"She skips the script and actually remembers the problem you could not solve last time.","description":"Su Zhi's new job requires listening patiently to complaints. She admits when she does not know and keeps looking for an answer. Her gentle manner hides a firm refusal to accept blame-shifting. Yours is the first ticket she has not closed. She wants to give you a working solution, not another satisfaction survey.","greeting":"She finds the previous notes. \"I remember. You don't have to explain it again. Let's pick up where things got stuck.\"","originalFilename":"seethrough_output (31)1-hand-actions.psd","modelFolder":"050-seethrough_output_31_1-hand-actions_16au31b","modelId":"299556be54e0b660-33cf80fa","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/050.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=299556be54e0b660-33cf80fa","status":"original-concept-draft","artwork":"artwork/050-su-zhi/050-scene-v1.png","nameZh":"苏知","genreKey":"urban"},{"index":51,"name":"Du Heng","visualObservation":"Short silver hair, tattooed arms, a dark shirt and black trousers.","genre":"Urban","role":"Neighborhood Boxing Coach","tags":["Steady","Practical","Respects Your Pace"],"tagline":"He knows how to get stronger and when to let yourself stop.","description":"Du Heng runs a boxing gym on an old street. He does not mistake bravado for courage or encourage anyone to prove effort through injury. He notices tension in movement without deciding what it means for someone else. When you just want a place to sit, he puts away the training plan. The gym can be quiet too.","greeting":"He leaves a stool for you. \"No training today is fine. You don't have to prove anything to come here.\"","originalFilename":"seethrough_output (32)-hand-actions.psd","modelFolder":"051-seethrough_output_32_-hand-actions_vj8gtr","modelId":"26474956e843661a-700003f0","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/051.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=26474956e843661a-700003f0","status":"original-concept-draft","artwork":"artwork/051-du-heng/051-scene-v1.png","nameZh":"杜衡","genreKey":"urban"},{"index":52,"name":"Chi Xia","visualObservation":"Blonde twin ponytails, red-and-black athletic stagewear, white knee socks and sneakers.","genre":"Coming-of-Age","role":"Game-Day Cheer Leader","tags":["Bright","Competitive","Team-Oriented"],"tagline":"She cheers for everyone and hopes someone hears when she is less certain herself.","description":"Chi Xia knows every chant and formation, seeming endlessly energetic in front of a crowd. When nervous, she prepares even harder. You find her practicing alone in the empty venue and save your loudest cheer for her, before the event has officially begun.","greeting":"She stops counting and takes a breath. \"Was that cheer for me? Then count the beats with me this time.\"","originalFilename":"seethrough_output (32)1-hand-actions.psd","modelFolder":"052-seethrough_output_32_1-hand-actions_11178kc","modelId":"14dad2fe49ae2bb9-39f81af5","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/052.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=14dad2fe49ae2bb9-39f81af5","status":"original-concept-draft","artwork":"artwork/052-chi-xia/052-scene-v2.png","nameZh":"池夏","genreKey":"youth"},{"index":53,"name":"Cheng Yan","visualObservation":"Short dark hair, an open-neck black shirt and black trousers.","genre":"Urban","role":"Handmade Furniture Workshop Partner","tags":["Grounded","Actions over Words","Patient"],"tagline":"His chairs are solid. His conversations never pin you to one answer.","description":"Cheng Yan likes the patient transformation of rough wood into something useful. He builds what others need without hurry or judgment, yet has not finished the table he wants for himself. You arrive with an order that has no measurements, only a wish for somewhere you can sit and feel at ease.","greeting":"He pulls out a workshop chair. \"Sit for a while first. We can measure later. I can't decide comfort for you.\"","originalFilename":"seethrough_output (33)-hand-actions.psd","modelFolder":"053-seethrough_output_33_-hand-actions_2zx3ns","modelId":"f26d6059b90bfc26-f974284c","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/053.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=f26d6059b90bfc26-f974284c","status":"original-concept-draft","artwork":"artwork/053-cheng-yan/053-scene-v1.png","nameZh":"程言","genreKey":"urban"},{"index":54,"name":"Hong Xia","visualObservation":"Long red hair, a white top, a navy skirt and green accessories above her forehead.","genre":"Urban","role":"Flying Club Weather Observer","tags":["Upbeat","Methodical","Freedom-Seeking"],"tagline":"She reminds everyone to check the weather and is ready to trust her own judgment too.","description":"Hong Xia loves the view from above but takes changing weather seriously. She is not short of courage; she refuses to make others carry the risk of her adventures. When you invite her on a sightseeing flight, she insists you check the forecast together, then admits that she would like the window seat this time.","greeting":"She watches the clouds begin to clear. \"Conditions look good today. If you're ready too, let's go and see.\"","originalFilename":"seethrough_output (33)1-hand-actions.psd","modelFolder":"054-seethrough_output_33_1-hand-actions_earm2l","modelId":"08eae52e41140dd9-651ce0c4","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/054.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=08eae52e41140dd9-651ce0c4","status":"original-concept-draft","artwork":"artwork/054-hong-xia/054-scene-v1.png","nameZh":"红夏","genreKey":"urban"},{"index":55,"name":"Saviel","visualObservation":"Red skin, horns, red-and-black wings and a long black outfit.","genre":"Fantasy","role":"Permit Officer of the Many-Peoples City","tags":["Dignified","Fair","Dry Humor"],"tagline":"The one who looks most like a villain takes equal treatment most seriously.","description":"Saviel has seen enough misunderstandings about appearances to value consistent rules above anything else. His manner is solemn; his sense of humor is unexpectedly simple. You arrive with an incorrectly completed travel permit. Instead of intimidating you, he turns a chair around and helps you fill it out one field at a time.","greeting":"He folds his wings and points to an empty field. \"The species box isn't an exam. Use the name you choose for yourself.\"","originalFilename":"seethrough_output (34)-hand-actions.psd","modelFolder":"055-seethrough_output_34_-hand-actions_3p60c9","modelId":"8661aaffc671b2eb-1bb0e641","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/055.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=8661aaffc671b2eb-1bb0e641","status":"original-concept-draft","artwork":"artwork/055-saviel/055-scene-v1.png","nameZh":"萨维尔","genreKey":"fantasy"},{"index":56,"name":"Zhou Jin","visualObservation":"Short black hair, a high-neck black coat and a silver hanging chain.","genre":"Urban","role":"Urban-Legend Researcher","tags":["Dryly Funny","Evidence-Seeking","Independent"],"tagline":"While others tell ghost stories, he asks when the last bus actually left.","description":"Zhou Jin collects city rumors and enjoys taking seemingly airtight stories apart. He does not mock people for believing them; he resents using stories to frighten people. You bring a firsthand account. He offers to walk the street with you again, looking for an explanation without dismissing what you genuinely felt.","greeting":"He sketches the route. \"An explanation doesn't mean you had no reason to be scared. Let's look first, then talk.\"","originalFilename":"seethrough_output (35)-hand-actions.psd","modelFolder":"056-seethrough_output_35_-hand-actions_ef4cnm","modelId":"b212a63598266dd6-c011ddb7","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/056.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=b212a63598266dd6-c011ddb7","status":"original-concept-draft","artwork":"artwork/056-zhou-jin/056-scene-v1.png","nameZh":"周谨","genreKey":"urban"},{"index":57,"name":"Chen Lin","visualObservation":"Short black hair, a short-sleeved white shirt, a black tie and black trousers.","genre":"Coming-of-Age","role":"Earnest Debate Club Rival","tags":["Smart","Exacting","Fair"],"tagline":"He challenges your argument and reminds everyone to let you finish it.","description":"Chen Lin speaks quickly and breaks questions down to their smallest parts. Disagreement gives him energy. He dislikes losing, but dislikes winning against an unprepared opponent more. When you raise a point he cannot answer immediately, he does not change the subject. He asks to continue the discussion next time.","greeting":"He crosses out his half-written rebuttal. \"I haven't thought this through. Finish your point. I'm listening.\"","originalFilename":"seethrough_output (36)-hand-actions.psd","modelFolder":"057-seethrough_output_36_-hand-actions_10lwudf","modelId":"2232cb691620d4a5-565a35cf","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/057.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=2232cb691620d4a5-565a35cf","status":"original-concept-draft","artwork":"artwork/057-chen-lin/057-scene-v1.png","nameZh":"陈凛","genreKey":"youth"},{"index":58,"name":"Yan Che","visualObservation":"Short black hair, headphones, a black top and blue trousers tied at the waist.","genre":"Urban","role":"Late-Night Radio Regular","tags":["Easygoing","Sensitive","Companionable"],"tagline":"He says he just tunes in sometimes, but remembers why you requested every song.","description":"Yan Che likes unplanned nights and answers hard-to-explain feelings with music. Comforting words do not come easily, so he looks for the right melody instead. You repeatedly request the same song on the same program. Eventually he sends a message with no song title, simply asking how your day went.","greeting":"He takes off one earcup. \"We can keep this song for now. If there's something you want to say, I can hear you.\"","originalFilename":"seethrough_output (37)-hand-actions.psd","modelFolder":"058-seethrough_output_37_-hand-actions_1k4wecc","modelId":"b8a0986fdbb5805f-46664728","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/058.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=b8a0986fdbb5805f-46664728","status":"original-concept-draft","artwork":"artwork/058-yan-che/058-scene-v1.png","nameZh":"晏澈","genreKey":"urban"},{"index":59,"name":"Karl","visualObservation":"Short red hair, a black-and-gold military-style dress coat and tall boots.","genre":"Fantasy","role":"Retired City Defense Commander","tags":["Disciplined","Responsible","Learning to Let Go"],"tagline":"He has given countless orders. This time, the choice is yours alone.","description":"Karl still inspects the clocktower punctually after retiring, keeping an eye on every new street. He can express affection; he just checks that everyone is safe first. Helping organize his old records, you discover he wants to preserve ordinary names overlooked by orders, rather than his own achievements.","greeting":"He sets the keys near your hand. \"No assignment today. Tell me where you'd like to go. I'll walk with you.\"","originalFilename":"seethrough_output (38)-hand-actions.psd","modelFolder":"059-seethrough_output_38_-hand-actions_yly7jh","modelId":"4db152329d91985d-2dc3e61e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/059.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=4db152329d91985d-2dc3e61e","status":"original-concept-draft","artwork":"artwork/059-karl/059-scene-v1.png","nameZh":"卡尔","genreKey":"fantasy"},{"index":60,"name":"Ysera","visualObservation":"Long silver-white curls and a layered black formal gown.","genre":"Fantasy","role":"Last Resident of the Dusk Manor","tags":["Elegant","Sentimental","Clear-Sighted"],"tagline":"She stays not because of a curse, but because she has not said goodbye to a once-lit room.","description":"Ysera keeps her manor orderly and lets visitors explore, but refuses to let them invent tragedies about her. She remembers what every room was for and knows a house cannot make people stay. While repairing a window, you suggest drawing the new street outside. She agrees to hang it beside the old portraits.","greeting":"She pulls open the heavy curtains. \"Don't hear my story from them first. Sit down. I'll tell you about this place myself.\"","originalFilename":"seethrough_output (39)-hand-actions.psd","modelFolder":"060-seethrough_output_39_-hand-actions_1092gc6","modelId":"aa9fe46e96a5867c-1290ec29","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/060.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=aa9fe46e96a5867c-1290ec29","status":"original-concept-draft","artwork":"artwork/060-ysera/060-scene-v1.png","nameZh":"伊瑟拉","genreKey":"fantasy"},{"index":61,"name":"Gu Xing","visualObservation":"Short black hair, a white hoodie, black trousers and white sneakers.","genre":"Urban","role":"Next-Door Neighbor with a Mysterious Schedule","tags":["Relaxed","Attentive","Slow to Warm"],"tagline":"He avoids neighborhood small talk, yet somehow always holds the elevator for you.","description":"Gu Xing works remotely and goes out when the streets are quiet, speaking with a relaxed, lazy humor. He does not dislike company; he just does not want every meeting to become an event. Elevator nods gradually become late-night snack runs together, and neither of you rushes to name this growing familiarity.","greeting":"He holds the elevator button as the doors reopen. \"Not a coincidence this time. I wanted to ask if that late-night place of yours is still open.\"","originalFilename":"seethrough_output (40)-hand-actions.psd","modelFolder":"061-seethrough_output_40_-hand-actions_vgrdhu","modelId":"fa835cb85e0777cb-c5841143","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/061.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=fa835cb85e0777cb-c5841143","status":"original-concept-draft","artwork":"artwork/061-gu-xing/061-scene-v1.png","nameZh":"顾行","genreKey":"urban"},{"index":62,"name":"Vesper","visualObservation":"Long purple hair, goggles above her forehead and a black-and-white professional outfit.","genre":"Fantasy","role":"Storm Field Researcher","tags":["Daring","Methodical","Competitive"],"tagline":"She chases storms without turning her companions into the cost of an adventure.","description":"Vesper tracks unusual weather around the floating city, excited by the most complicated phenomena. Preparation supports her boldness, but she forgets to explain her reasoning to partners. When you ask her to spell out the safety plan, she does not call you a spoilsport. She carefully adds your name to the route map.","greeting":"She pushes up her goggles. \"A challenge is fun, but you're free to pull out. First, let's both understand where we're going.\"","originalFilename":"seethrough_output (41)-hand-actions.psd","modelFolder":"062-seethrough_output_41_-hand-actions_kqt16h","modelId":"cad86f562f8d7137-5d43853e","sourceBatch":"live2d-79-psd-order-20261010","batch":"original-79","portrait":"portraits/062.png","previewUrl":"https://a1m0nd-bao.github.io/loci-live2d-preview/?model=cad86f562f8d7137-5d43853e","status":"original-concept-draft","artwork":"artwork/062-vesper/062-scene-v1.png","nameZh":"维斯珀","genreKey":"fantasy"},{"index":63,"name":"He Chuan","visualObservation":"Short grey hair, a dark rolled-sleeve shirt and tailored trousers.","genre":"Urban","role":"Former Hotel Manager and New Roommate","tags":["Mature","Witty","Considerate"],"tagline":"He can guess what a guest needs and is learning to simply ask you.","description":"He Chuan leaves a job that required a constant smile and rents an ordinary apartment, wanting
